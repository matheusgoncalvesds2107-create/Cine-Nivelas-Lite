<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Cinenovelas Lite V3</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0d0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #18171c;
    padding: 20px;
    position: sticky;
    top: 0;
}

h1 {
    margin: 0 0 15px 0;
    font-size: 24px;
}

input {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}

main {
    padding: 18px;
}

#status {
    background: #222328;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}

.card {
    background: #222328;
    padding: 18px;
    border-radius: 14px;
    cursor: pointer;
}

.card h2 {
    font-size: 19px;
    margin: 0 0 6px 0;
}

.card span {
    color: #aaaaaa;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 16px;
}

</style>
</head>

<body>

<header>
    <h1>CINENOVELAS LITE V3</h1>

    <input
        id="busca"
        placeholder="Buscar novela..."
        onkeyup="filtrar()">
</header>

<main>

<div id="status">
    Catálogo NoveFlix
</div>

<div id="lista" class="grid"></div>

</main>

<script>

var novelas = [

    {
        nome: "Colisão",
        ano: "2026",
        url: "https://noveflix.lol/assista/colisao/"
    },

    {
        nome: "Sol da Minha Vida",
        ano: "2022",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "A Mulher Proibida",
        ano: "2026",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "A Nova Vida de Ana",
        ano: "2023",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "Chamas da Vida",
        ano: "2008",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "Essas Mulheres",
        ano: "2005",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "Rosario Tijeras",
        ano: "2016",
        url: "https://noveflix.lol/categoria/novelas/"
    },

    {
        nome: "O Herdeiro",
        ano: "2025",
        url: "https://noveflix.lol/categoria/novelas/"
    }

];

function mostrar(lista) {

    var box = document.getElementById("lista");

    box.innerHTML = "";

    for (var i = 0; i < lista.length; i++) {

        var n = lista[i];

        var card = document.createElement("div");

        card.className = "card";

        card.innerHTML =
            "<h2>" + n.nome + "</h2>" +
            "<span>" + n.ano + "</span>";

        card.setAttribute(
            "data-url",
            n.url
        );

        card.onclick = function() {

            var url = this.getAttribute("data-url");

            window.location.href = url;
        };

        box.appendChild(card);
    }
}

function filtrar() {

    var texto =
        document.getElementById("busca")
        .value
        .toLowerCase();

    var resultado = [];

    for (var i = 0; i < novelas.length; i++) {

        if (
            novelas[i].nome
            .toLowerCase()
            .indexOf(texto) >= 0
        ) {
            resultado.push(novelas[i]);
        }
    }

    mostrar(resultado);
}

mostrar(novelas);

</script>

</body>
</html>
