<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinenovelas Lite</title>

<style>
body {
    margin: 0;
    background: #0d0d0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    background: #17171b;
    font-size: 22px;
    font-weight: bold;
}

#status {
    margin: 25px;
    padding: 18px;
    background: #202027;
    border-radius: 12px;
    font-size: 16px;
}
</style>
</head>

<body>

<header>CINENOVELAS LITE V2</header>

<div id="status">
Abrindo teste V2...
</div>

<script>

document.getElementById("status").innerHTML =
    "JavaScript OK ✅";

setTimeout(function() {

    if (window.AndroidApi) {

        document.getElementById("status").innerHTML =
            "JavaScript OK ✅<br>Ponte Android OK ✅<br>Testando servidor...";

        AndroidApi.get("home", "resultadoTeste");

    } else {

        document.getElementById("status").innerHTML =
            "JavaScript OK ✅<br>Ponte Android NÃO encontrada ❌";

    }

}, 1000);

function resultadoTeste(status, body, erro) {

    document.getElementById("status").innerHTML =
        "JavaScript OK ✅<br>" +
        "Ponte Android OK ✅<br>" +
        "HTTP: " + status + "<br><br>" +
        (erro ? erro : body.substring(0, 400));

}

</script>
setTimeout(function() {

  if (window.AndroidApi) {

    setStatus("Ponte Android OK. Conectando ao servidor...");
    iniciar();

  } else {

    setStatus("ERRO: ponte Android não encontrada.", "erro");

  }

}, 1500);
</body>
</html>
