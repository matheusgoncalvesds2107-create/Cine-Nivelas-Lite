<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #292929;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.buscaBox{
    display:flex;
    margin:17px;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:white;
    padding:15px 18px;
    font-size:17px;
}

.buscaBox button{
    width:62px;
    border:0;
    background:#e31326;
    color:white;
    font-size:22px;
}

main{
    padding:17px;
}

.status{
    background:#1d1d20;
    border-radius:9px;
    padding:14px;
    margin-bottom:18px;
    color:#bbb;
    line-height:1.5;
}

.ok{
    color:#8cff9b;
}

.erro{
    color:#ff8585;
}

.titulo{
    display:flex;
    align-items:center;
    margin:20px 0 15px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:11px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;
}

.capa{
    height:175px;
    border-radius:7px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:9px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );
}

.capa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nome{
    margin-top:7px;
    font-size:14px;
    line-height:1.3;
    font-weight:bold;
}

.episodios{
    margin-top:3px;
    font-size:12px;
    color:#999;
}


/* DETALHES */

#detalheTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;

    display:flex;
    align-items:center;

    padding:12px 16px;

    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:#252525;
    color:white;

    font-size:27px;

    margin-right:13px;
}

.detalhes{
    padding:18px;
}

.painel{
    background:#1d1d20;
    border-radius:10px;
    padding:16px;
}

.painel h2{
    margin-top:0;
}

.info{
    color:#bbb;
    line-height:1.6;
}

</style>
</head>

<body>


<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">

    <div class="logo">

        <span class="logo1">
            NOVELAS
        </span><span class="logo2">PLAY</span>

    </div>

</div>


<div class="buscaBox">

    <input
        id="busca"
        placeholder="Pesquisar novela turca...">

    <button id="btnBusca">
        🔍
    </button>

</div>


<main>

<div
    id="status"
    class="status">

    Carregando AssistirFarah...

</div>


<div class="titulo">

    <div class="linha"></div>

    Novelas Turcas

</div>


<div
    id="grade"
    class="grade">
</div>

</main>

</div>



<!-- DETALHE -->

<div id="detalheTela">

<div class="subTopo">

    <button
        id="voltar"
        class="voltar">
        ‹
    </button>

    <strong id="tituloTopo">
        Novela
    </strong>

</div>


<div class="detalhes">

    <div class="painel">

        <h2 id="tituloDetalhe">
            Novela
        </h2>

        <div
            id="infoDetalhe"
            class="info">

            Carregando...

        </div>

    </div>

</div>

</div>



<script>

var URL =
    "https://assistirfarah.com/";

var catalogo = [];

var exibindo = [];


/*
 * ===================================
 * INÍCIO
 * ===================================
 */

function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        status(
            "AndroidSite não encontrado.",
            "erro"
        );

        return;
    }


    status(
        "Buscando catálogo do AssistirFarah..."
    );


    AndroidSite.get(
        URL,
        "receberCatalogo"
    );
}



/*
 * ===================================
 * RECEBE CATÁLOGO
 * ===================================
 */

function receberCatalogo(
    codigo,
    html,
    erro
){

    if(erro){

        status(
            erro,
            "erro"
        );

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        status(
            "HTTP "+codigo,
            "erro"
        );

        return;
    }


    catalogo =
        extrair(
            html
        );


    exibindo =
        catalogo.slice(0);


    status(
        catalogo.length+
        " títulos encontrados ✅",
        "ok"
    );


    montar(
        exibindo
    );
}



/*
 * ===================================
 * EXTRATOR
 *
 * ESTE É O MESMO MODELO
 * QUE ENCONTROU OS 31 TÍTULOS.
 * ===================================
 */

function extrair(html){

    var doc =
        new DOMParser()
        .parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var lista = [];

    var usados = {};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];


        var href =
            a.getAttribute(
                "href"
            )
            ||
            "";


        href =
            normalizar(
                href
            );


        if(
            !href ||
            href === URL
        ){

            continue;
        }


        if(
            href.indexOf(
                "#"
            ) >= 0
        ){

            continue;
        }


        var texto =
            limpar(
                a.textContent
            );


        var img =
            a.querySelector(
                "img"
            );


        var alt="";


        if(img){

            alt =
                limpar(
                    img.getAttribute(
                        "alt"
                    )
                );
        }


        var bloco =
            a.parentNode;


        var textoBloco =
            bloco
            ?
            limpar(
                bloco.textContent
            )
            :
            texto;


        /*
         * Parte importante que já funcionou:
         * procura "XX episódios".
         */
        var match =
            textoBloco.match(
                /(\d+)\s*epis[oó]dios?/i
            );


        if(!match){

            continue;
        }


        /*
         * Mantemos a lógica original.
         */
        var nome =
            alt || texto;


        if(!nome){

            continue;
        }


        nome =
            nome.replace(
                /\s*Completa.*$/i,
                ""
            );


        nome =
            nome.replace(
                /\s*\d+\s*epis[oó]dios?.*$/i,
                ""
            );


        nome =
            limpar(
                nome
            );


        /*
         * ÚNICA MUDANÇA:
         * limpa nomes grudados/duplicados.
         */
        nome =
            corrigirNome(
                nome
            );


        if(
            nome.length < 3
        ){

            continue;
        }


        var chave =
            href.toLowerCase();


        if(
            usados[chave]
        ){

            continue;
        }


        var capa="";


        if(img){

            capa =
                img.getAttribute(
                    "data-src"
                )
                ||
                img.getAttribute(
                    "data-lazy-src"
                )
                ||
                img.getAttribute(
                    "src"
                )
                ||
                "";
        }


        capa =
            normalizarImagem(
                capa
            );


        usados[chave]=true;


        lista.push({

            nome:
                nome,

            episodios:
                match[1],

            url:
                href,

            capa:
                capa

        });
    }


    return lista;
}



/*
 * ===================================
 * CORRIGE SOMENTE O NOME
 * ===================================
 */

function corrigirNome(nome){

    nome =
        limpar(
            nome
        );


    if(!nome){

        return "";
    }


    /*
     * CASO 1
     *
     * Eşref RüyaEşref Rüya
     *
     * vira:
     *
     * Eşref Rüya
     */
    if(
        nome.length % 2 === 0
    ){

        var metade =
            nome.length / 2;


        var primeira =
            nome.substring(
                0,
                metade
            );


        var segunda =
            nome.substring(
                metade
            );


        if(
            primeira.toLowerCase()
            ===
            segunda.toLowerCase()
        ){

            return limpar(
                segunda
            );
        }
    }


    /*
     * CASO 2
     *
     * YargıYargı: Segredos de Família
     * HercaiHercai: Amor e Vingança
     * YabaniYabani: Coração Selvagem
     */

    var posDoisPontos =
        nome.indexOf(
            ":"
        );


    if(
        posDoisPontos > 0
    ){

        var antes =
            nome.substring(
                0,
                posDoisPontos
            );


        if(
            antes.length % 2 === 0
        ){

            var metadeAntes =
                antes.length / 2;


            var a =
                antes.substring(
                    0,
                    metadeAntes
                );


            var b =
                antes.substring(
                    metadeAntes
                );


            if(
                a.toLowerCase()
                ===
                b.toLowerCase()
            ){

                return limpar(
                    b+
                    nome.substring(
                        posDoisPontos
                    )
                );
            }
        }
    }


    /*
     * CASO 3
     *
     * Adım FarahMeu Nome é Farah
     *
     * vira:
     *
     * Adım Farah / Meu Nome é Farah
     *
     *
     * Sefirin KızıA Filha do Embaixador
     *
     * vira:
     *
     * Sefirin Kızı / A Filha do Embaixador
     */

    nome =
        nome.replace(
            /([a-záàâãéêíóôõúçğıöşü])([A-ZÁÀÂÃÉÊÍÓÔÕÚÇĞİÖŞÜ])/g,
            "$1 / $2"
        );


    /*
     * Se ficou assim:
     *
     * Yargı / Yargı: Segredos...
     *
     * remove a primeira repetição.
     */

    if(
        nome.indexOf(
            " / "
        ) >= 0
    ){

        var partes =
            nome.split(
                " / "
            );


        if(
            partes.length === 2
        ){

            var esquerda =
                limpar(
                    partes[0]
                );


            var direita =
                limpar(
                    partes[1]
                );


            if(
                direita
                .toLowerCase()
                .indexOf(
                    esquerda.toLowerCase()
                ) === 0
            ){

                return direita;
            }
        }
    }


    return limpar(
        nome
    );
}



/*
 * ===================================
 * MONTA GRADE
 * ===================================
 */

function montar(lista){

    var grade =
        document.getElementById(
            "grade"
        );


    grade.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var item =
            lista[i];


        var card =
            document.createElement(
                "div"
            );


        card.className=
            "card";


        var capa="";


        if(
            item.capa &&
            (
                item.capa.indexOf(
                    "http://"
                ) === 0
                ||
                item.capa.indexOf(
                    "https://"
                ) === 0
            )
        ){

            capa =
                '<img src="' +
                esc(
                    item.capa
                ) +
                '" alt="">';

        }else{

            capa =
                esc(
                    item.nome
                );
        }


        card.innerHTML=

            '<div class="capa">'+
            capa+
            '</div>'+

            '<div class="nome">'+
            esc(
                item.nome
            )+
            '</div>'+

            '<div class="episodios">'+
            item.episodios+
            ' episódios'+
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                abrir(
                    exibindo[
                        parseInt(
                            this.getAttribute(
                                "data-index"
                            )
                        )
                    ]
                );
            };


        grade.appendChild(
            card
        );
    }
}



/*
 * ===================================
 * ABRIR DETALHE
 * ===================================
 */

function abrir(item){

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "detalheTela"
    )
    .style.display=
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "tituloDetalhe"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "infoDetalhe"
    )
    .innerHTML=

        '<strong>'+
        item.episodios+
        ' episódios encontrados.</strong>'+
        '<br><br>'+
        'Página pública:<br>'+
        esc(
            item.url
        );
}



/*
 * ===================================
 * PESQUISA
 * ===================================
 */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    exibindo=[];


    for(
        var i=0;
        i<catalogo.length;
        i++
    ){

        if(
            catalogo[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            exibindo.push(
                catalogo[i]
            );
        }
    }


    montar(
        exibindo
    );
}



/*
 * ===================================
 * NORMALIZA URL
 * ===================================
 */

function normalizar(url){

    if(!url){

        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0) === "/"
    ){

        return

            "https://assistirfarah.com"+
            url;
    }


    return "";
}



/*
 * ===================================
 * NORMALIZA IMAGEM
 * ===================================
 */

function normalizarImagem(url){

    if(!url){

        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
        ||
        url.indexOf(
            "http://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0) === "/"
    ){

        return

            "https://assistirfarah.com"+
            url;
    }


    return "";
}



/*
 * ===================================
 * LIMPA TEXTO
 * ===================================
 */

function limpar(texto){

    if(!texto){

        return "";
    }


    return String(texto)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^\s+|\s+$/g,
            ""
        );
}



/*
 * ===================================
 * SEGURANÇA HTML
 * ===================================
 */

function esc(texto){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";
    }


    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}



/*
 * ===================================
 * STATUS
 * ===================================
 */

function status(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );


    box.className =
        "status";


    if(tipo){

        box.className +=
            " "+tipo;
    }


    box.innerHTML=
        esc(
            texto
        );
}



/*
 * ===================================
 * EVENTOS
 * ===================================
 */

document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "voltar"
)
.addEventListener(
    "click",
    function(){

        document
        .getElementById(
            "detalheTela"
        )
        .style.display=
            "none";


        document
        .getElementById(
            "catalogoTela"
        )
        .style.display=
            "block";
    }
);



/*
 * ===================================
 * INICIAR
 * ===================================
 */

setTimeout(
    iniciar,
    500
);

</script>

</body>
</html>
