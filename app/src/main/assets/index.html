<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #292929;
}

.menu{
    position:absolute;
    left:20px;
    font-size:30px;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.barraBusca{
    padding:17px;
    background:#101011;
    border-bottom:7px solid #222;
}

.buscaBox{
    display:flex;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:#fff;
    padding:15px 18px;
    font-size:17px;
}

.btnBusca{
    width:62px;
    border:0;
    background:#e31326;
    color:#fff;
    font-size:24px;
}

main{
    padding:17px;
}

.tituloSecao{
    display:flex;
    align-items:center;
    margin:20px 0 16px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:12px;
}

.topLista{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:12px;
}

.poster{
    min-width:140px;
    width:140px;
}

.capa{
    height:200px;
    border-radius:6px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            #901d29,
            #1b1b1d 55%,
            #4d1017
        );
    font-size:18px;
    font-weight:bold;
}

.numero{
    position:absolute;
    top:-8px;
    left:4px;
    font-size:48px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
}

.tipo{
    position:absolute;
    left:8px;
    bottom:12px;
    writing-mode:vertical-rl;
    letter-spacing:3px;
    font-size:10px;
}

.nomePoster{
    margin-top:8px;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.divisor{
    height:1px;
    background:#292929;
    margin:17px 0;
}

.categorias{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.categorias button{
    min-height:52px;
    border:0;
    border-radius:5px;
    background:#222;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.categoriaTopo{
    margin-top:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.verTudo{
    background:#dc1729;
    padding:8px 11px;
    border-radius:4px;
    font-size:12px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
    margin-top:16px;
}

.cardCapa{
    height:175px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );
}

.cardNome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* EPISÓDIOS */

#novelaTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;
    display:flex;
    align-items:center;
    padding:12px 16px;
    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#252525;
    color:#fff;
    font-size:27px;
    margin-right:13px;
}

.subTitulo strong{
    display:block;
    font-size:19px;
}

.subTitulo span{
    color:#aaa;
    font-size:13px;
}

.episodios{
    padding:16px;
}

.ep{
    width:100%;
    display:flex;
    align-items:center;
    padding:15px;
    margin-bottom:10px;
    border:0;
    border-radius:8px;
    background:#202024;
    color:#fff;
    text-align:left;
}

.epNumero{
    width:45px;
    height:45px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:13px;
    background:#e31326;
    font-weight:bold;
}

.epTexto strong{
    display:block;
    font-size:16px;
}

.epTexto span{
    display:block;
    margin-top:4px;
    color:#aaa;
    font-size:13px;
}

.aviso{
    margin:16px;
    padding:14px;
    border-radius:8px;
    background:#1d1d20;
    color:#bbb;
    line-height:1.5;
    font-size:14px;
}

</style>
</head>

<body>

<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">

    <div class="menu">☰</div>

    <div class="logo">
        <span class="logo1">NOVELAS</span><span class="logo2">PLAY</span>
    </div>

</div>

<div class="barraBusca">

    <div class="buscaBox">

        <input
            id="busca"
            placeholder="Pesquisar novela...">

        <button
            id="btnBusca"
            class="btnBusca">
            🔍
        </button>

    </div>

</div>

<main>

<div class="tituloSecao">
    <div class="linha"></div>
    Mais Assistidos
</div>

<div
    id="topLista"
    class="topLista">
</div>

<div class="divisor"></div>

<div class="categorias">

    <button>Novelas</button>
    <button>Séries</button>
    <button>Programas</button>
    <button>Filmes</button>
    <button>Shows</button>

</div>

<div class="categoriaTopo">

    <div class="tituloSecao" style="margin:0">

        <div class="linha"></div>

        Novelas

    </div>

    <div class="verTudo">
        VER TUDO
    </div>

</div>

<div
    id="grade"
    class="grade">
</div>

</main>

</div>


<!-- EPISÓDIOS -->

<div id="novelaTela">

<div class="subTopo">

    <button
        id="voltarCatalogo"
        class="voltar">
        ‹
    </button>

    <div class="subTitulo">

        <strong id="nomeNovela">
            Novela
        </strong>

        <span>
            Episódios
        </span>

    </div>

</div>

<div
    id="listaEpisodios"
    class="episodios">
</div>

<div
    id="aviso"
    class="aviso">

    Toque em um episódio para abrir no player do NovelasPlay.

</div>

</div>


<script>

/* NOVELAS */

var novelas = [

    {nome:"Quem Ama Cuida"},
    {nome:"Meu Nome é Farah"},
    {nome:"Longe Demais"},
    {nome:"Carinha de Anjo"},
    {nome:"A Usurpadora"},
    {nome:"Colisão"},
    {nome:"Sol da Minha Vida"},
    {nome:"Chamas da Vida"},
    {nome:"Essas Mulheres"}

];

var novelaAtual = "";

var episodiosAtuais = [];


/*
   3 VÍDEOS PÚBLICOS DE TESTE.

   abertura está em MILISSEGUNDOS.
*/

function criarEpisodios(nome){

    return [

        {
            numero:1,

            titulo:
                nome+
                " - Episódio 1",

            url:
                "https://www.w3schools.com/html/mov_bbb.mp4",

            abertura:3000
        },

        {
            numero:2,

            titulo:
                nome+
                " - Episódio 2",

            url:
                "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",

            abertura:5000
        },

        {
            numero:3,

            titulo:
                nome+
                " - Episódio 3",

            url:
                "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",

            abertura:5000
        }

    ];
}


/* TOP */

function montarTop(){

    var box =
        document.getElementById(
            "topLista"
        );

    box.innerHTML="";

    var limite =
        Math.min(
            5,
            novelas.length
        );

    for(
        var i=0;
        i<limite;
        i++
    ){

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "poster";

        item.innerHTML =

            '<div class="capa">'+

            '<div class="numero">'+
            (i+1)+
            '</div>'+

            '<div class="tipo">'+
            'NOVELA'+
            '</div>'+

            novelas[i].nome+

            '</div>'+

            '<div class="nomePoster">'+
            novelas[i].nome+
            '</div>';

        item.setAttribute(
            "data-nome",
            novelas[i].nome
        );

        item.onclick =
            function(){

                abrirNovela(
                    this.getAttribute(
                        "data-nome"
                    )
                );

            };

        box.appendChild(
            item
        );
    }
}


/* GRADE */

function montarGrade(lista){

    var box =
        document.getElementById(
            "grade"
        );

    box.innerHTML="";

    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var card =
            document.createElement(
                "div"
            );

        card.className =
            "card";

        card.innerHTML =

            '<div class="cardCapa">'+
            lista[i].nome+
            '</div>'+

            '<div class="cardNome">'+
            lista[i].nome+
            '</div>';

        card.setAttribute(
            "data-nome",
            lista[i].nome
        );

        card.onclick =
            function(){

                abrirNovela(
                    this.getAttribute(
                        "data-nome"
                    )
                );

            };

        box.appendChild(
            card
        );
    }
}


/* BUSCA */

function pesquisar(){

    var texto =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();

    var resultado = [];

    for(
        var i=0;
        i<novelas.length;
        i++
    ){

        if(
            novelas[i]
            .nome
            .toLowerCase()
            .indexOf(texto) >= 0
        ){

            resultado.push(
                novelas[i]
            );
        }
    }

    montarGrade(
        resultado
    );
}


/* ABRE NOVELA */

function abrirNovela(nome){

    novelaAtual =
        nome;

    episodiosAtuais =
        criarEpisodios(
            nome
        );

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "none";

    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "block";

    document
    .getElementById(
        "nomeNovela"
    )
    .innerHTML =
        nome;

    document
    .getElementById(
        "aviso"
    )
    .innerHTML =
        "Toque em um episódio para abrir no player do NovelasPlay.";

    montarEpisodios();
}


/* MONTA EPISÓDIOS */

function montarEpisodios(){

    var box =
        document.getElementById(
            "listaEpisodios"
        );

    box.innerHTML = "";

    for(
        var i=0;
        i<episodiosAtuais.length;
        i++
    ){

        var ep =
            episodiosAtuais[i];

        var botao =
            document.createElement(
                "button"
            );

        botao.className =
            "ep";

        botao.innerHTML =

            '<div class="epNumero">'+
            ep.numero+
            '</div>'+

            '<div class="epTexto">'+

            '<strong>'+
            'Episódio '+
            ep.numero+
            '</strong>'+

            '<span>'+
            novelaAtual+
            '</span>'+

            '</div>';

        botao.setAttribute(
            "data-index",
            i
        );

        botao.onclick =
            function(){

                abrirPlayer(
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    )
                );

            };

        box.appendChild(
            botao
        );
    }
}


/*
   MANDA A LISTA INTEIRA
   PARA O PLAYER NATIVO
*/

function abrirPlayer(indice){

    if(
        typeof AndroidPlayer ===
        "undefined"
    ){

        document
        .getElementById(
            "aviso"
        )
        .innerHTML =
            "ERRO: player Android não encontrado.";

        return;
    }


    var urls = [];

    var titulos = [];

    var aberturas = [];


    for(
        var i=0;
        i<episodiosAtuais.length;
        i++
    ){

        urls.push(
            episodiosAtuais[i].url
        );

        titulos.push(
            "Episódio "+
            episodiosAtuais[i].numero
        );

        aberturas.push(
            episodiosAtuais[i].abertura
        );
    }


    document
    .getElementById(
        "aviso"
    )
    .innerHTML =
        "Abrindo Episódio "+
        (indice+1)+
        "...";


    AndroidPlayer.playList(

        novelaAtual,

        urls.join("|"),

        titulos.join("|"),

        aberturas.join("|"),

        indice

    );
}


/* VOLTAR */

function voltarCatalogo(){

    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "none";

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "block";
}


/* EVENTOS */

document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "voltarCatalogo"
)
.addEventListener(
    "click",
    voltarCatalogo
);


/* INICIAR */

montarTop();

montarGrade(
    novelas
);

</script>

</body>
</html>
