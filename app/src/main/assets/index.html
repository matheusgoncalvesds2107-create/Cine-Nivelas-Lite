<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>NovelasPlay</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #292929;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.barraBusca{
    padding:17px;
    background:#101011;
    border-bottom:7px solid #222;
}

.buscaBox{
    display:flex;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:#fff;
    padding:15px 18px;
    font-size:17px;
}

.btnBusca{
    width:62px;
    border:0;
    background:#e31326;
    color:white;
    font-size:24px;
}

main{
    padding:17px;
}

.status{
    background:#1d1d20;
    border-radius:8px;
    padding:14px;
    margin-bottom:16px;
    color:#bbb;
    line-height:1.5;
}

.ok{
    color:#8cff9b;
}

.erro{
    color:#ff8080;
}

.tituloSecao{
    display:flex;
    align-items:center;
    margin:20px 0 16px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:12px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.cardCapa{
    height:175px;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:9px;

    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );
}

.cardCapa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cardNome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
}

.cardAno{
    color:#999;
    font-size:12px;
    margin-top:3px;
}


/* TELA NOVELA */

#novelaTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;
    display:flex;
    align-items:center;
    padding:12px 16px;
    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#252525;
    color:#fff;
    font-size:27px;
    margin-right:13px;
}

.subTitulo strong{
    display:block;
    font-size:19px;
}

.subTitulo span{
    color:#aaa;
    font-size:13px;
}

.conteudo{
    padding:18px;
}

.painel{
    background:#1d1d20;
    border-radius:10px;
    padding:16px;
}

.painel h2{
    margin-top:0;
}

.ep{
    width:100%;
    display:flex;
    align-items:center;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#26262b;
    color:#fff;
    text-align:left;
}

.epNumero{
    width:45px;
    height:45px;
    flex:none;
    border-radius:50%;
    background:#e31326;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:12px;
    font-weight:bold;
}

.epTexto strong{
    display:block;
    font-size:16px;
}

.epTexto span{
    display:block;
    color:#aaa;
    margin-top:4px;
    font-size:12px;
}
</style>
</head>

<body>

<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">
    <div class="logo">
        <span class="logo1">NOVELAS</span><span class="logo2">PLAY</span>
    </div>
</div>

<div class="barraBusca">

    <div class="buscaBox">

        <input
            id="busca"
            placeholder="Pesquisar novela...">

        <button
            id="btnBusca"
            class="btnBusca">
            🔍
        </button>

    </div>

</div>

<main>

<div id="status" class="status">
    Carregando catálogo...
</div>

<div class="tituloSecao">
    <div class="linha"></div>
    Novelas
</div>

<div id="grade" class="grade"></div>

</main>

</div>


<!-- NOVELA -->

<div id="novelaTela">

<div class="subTopo">

    <button
        id="voltar"
        class="voltar">
        ‹
    </button>

    <div class="subTitulo">

        <strong id="tituloTopo">
            Novela
        </strong>

        <span>
            NovelasPlay
        </span>

    </div>

</div>

<div class="conteudo">

<div class="painel">

    <h2 id="tituloNovela">
        Novela
    </h2>

    <div id="info" class="status">
        Carregando...
    </div>

    <div class="tituloSecao">
        <div class="linha"></div>
        Capítulos / Episódios
    </div>

    <div id="episodios"></div>

</div>

</div>

</div>


<script>

var URL_CATALOGO =
    "https://noveflix.lol/categoria/novelas/";

var novelas = [];
var filtradas = [];
var novelaAtual = null;


/* INÍCIO */

function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        status(
            "AndroidSite não encontrado.",
            "erro"
        );

        return;
    }

    AndroidSite.get(
        URL_CATALOGO,
        "receberCatalogo"
    );
}


/* CATÁLOGO */

function receberCatalogo(
    codigo,
    html,
    erro
){

    if(erro){

        status(
            erro,
            "erro"
        );

        return;
    }

    if(
        codigo < 200 ||
        codigo >= 400
    ){

        status(
            "HTTP "+codigo,
            "erro"
        );

        return;
    }

    novelas =
        extrairNovelas(
            html
        );

    filtradas =
        novelas.slice(0);

    status(
        novelas.length+
        " novelas encontradas.",
        "ok"
    );

    montarGrade(
        filtradas
    );
}


function extrairNovelas(html){

    var parser =
        new DOMParser();

    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    var links =
        doc.querySelectorAll(
            "a[href]"
        );

    var lista = [];
    var usados = {};

    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];

        var href =
            normalizar(
                a.getAttribute(
                    "href"
                )
            );

        if(
            href.indexOf(
                "https://noveflix.lol/assista/"
            ) !== 0
        ){
            continue;
        }

        if(usados[href]){
            continue;
        }

        var img =
            a.querySelector(
                "img"
            );

        var nome =
            limpar(
                a.textContent
            );

        if(
            !nome &&
            img
        ){

            nome =
                limpar(
                    img.getAttribute(
                        "alt"
                    )
                );
        }

        if(!nome){
            continue;
        }

        var capa="";

        if(img){

            capa =
                img.getAttribute(
                    "data-src"
                )
                ||
                img.getAttribute(
                    "src"
                )
                ||
                "";
        }

        var pai =
            a.parentNode;

        var texto =
            pai
            ?
            limpar(
                pai.textContent
            )
            :
            "";

        var ano="";

        var m =
            texto.match(
                /\b(19|20)\d{2}\b/
            );

        if(m){
            ano=m[0];
        }

        usados[href]=true;

        lista.push({

            nome:nome,
            ano:ano,
            capa:capa,
            url:href

        });
    }

    return lista;
}


/* CARDS */

function montarGrade(lista){

    var grade =
        document.getElementById(
            "grade"
        );

    grade.innerHTML="";

    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var item =
            lista[i];

        var card =
            document.createElement(
                "div"
            );

        var imagem="";

        if(
            item.capa &&
            item.capa.indexOf(
                "http"
            )===0
        ){

            imagem =
                '<img src="' +
                esc(item.capa) +
                '">';

        }else{

            imagem =
                esc(
                    item.nome
                );
        }

        card.innerHTML=

            '<div class="cardCapa">'+
            imagem+
            '</div>'+

            '<div class="cardNome">'+
            esc(item.nome)+
            '</div>'+

            '<div class="cardAno">'+
            esc(item.ano)+
            '</div>';

        card.setAttribute(
            "data-index",
            i
        );

        card.onclick=function(){

            abrirNovela(
                filtradas[
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    )
                ]
            );
        };

        grade.appendChild(
            card
        );
    }
}


/* ABRIR NOVELA */

function abrirNovela(novela){

    novelaAtual =
        novela;

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "none";

    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "block";

    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML =
        esc(
            novela.nome
        );

    document
    .getElementById(
        "tituloNovela"
    )
    .innerHTML =
        esc(
            novela.nome
        );

    document
    .getElementById(
        "episodios"
    )
    .innerHTML="";

    info(
        "Procurando botão ASSISTIR..."
    );

    AndroidSite.get(
        novela.url,
        "receberPaginaNovela"
    );
}


/* PROCURA ASSISTIR */

function receberPaginaNovela(
    codigo,
    html,
    erro
){

    if(erro){

        info(
            erro
        );

        return;
    }

    if(
        codigo < 200 ||
        codigo >= 400
    ){

        info(
            "HTTP "+codigo
        );

        return;
    }

    var parser =
        new DOMParser();

    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    var links =
        doc.querySelectorAll(
            "a[href]"
        );

    var assistir="";

    for(
        var i=0;
        i<links.length;
        i++
    ){

        var texto =
            limpar(
                links[i].textContent
            )
            .toLowerCase();

        if(
            texto==="assistir"
            ||
            texto.indexOf(
                "assistir"
            )>=0
        ){

            assistir =
                normalizar(
                    links[i].getAttribute(
                        "href"
                    )
                );

            if(assistir){
                break;
            }
        }
    }


    if(!assistir){

        info(
            "Página carregada ✅<br><br>"+
            "O botão ASSISTIR não apareceu como link público no HTML."
        );

        return;
    }


    /*
     * AndroidSite aceita somente
     * páginas do próprio NoveFlix.
     */

    if(
        assistir.indexOf(
            "https://noveflix.lol/"
        ) !== 0
    ){

        info(
            "Botão ASSISTIR encontrado ✅<br><br>"+
            "Mas ele aponta para outro domínio. "+
            "Não vamos seguir automaticamente."
        );

        return;
    }


    info(
        "Botão ASSISTIR encontrado ✅<br><br>"+
        "Carregando página de episódios..."
    );


    AndroidSite.get(
        assistir,
        "receberPaginaAssistir"
    );
}


/* SEGUNDA PÁGINA */

function receberPaginaAssistir(
    codigo,
    html,
    erro
){

    if(erro){

        info(
            erro
        );

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        info(
            "HTTP "+codigo
        );

        return;
    }


    var episodios =
        encontrarEpisodios(
            html
        );


    if(
        episodios.length===0
    ){

        info(
            "Página ASSISTIR carregada ✅<br><br>"+
            "Nenhum link público de capítulo foi encontrado."
        );

        return;
    }


    info(
        episodios.length+
        " episódios encontrados ✅"
    );


    montarEpisodios(
        episodios
    );
}


/* PROCURA LINKS DE EPISÓDIOS */

function encontrarEpisodios(html){

    var parser =
        new DOMParser();


    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var lista=[];
    var usados={};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var texto =
            limpar(
                links[i].textContent
            );


        var href =
            normalizar(
                links[i].getAttribute(
                    "href"
                )
            );


        var teste =
            (
                texto+
                " "+
                href
            )
            .toLowerCase();


        var valido =

            teste.indexOf(
                "episodio"
            )>=0

            ||

            teste.indexOf(
                "episódio"
            )>=0

            ||

            teste.indexOf(
                "capitulo"
            )>=0

            ||

            teste.indexOf(
                "capítulo"
            )>=0;


        if(!valido){
            continue;
        }


        /*
         * Somente páginas públicas
         * do próprio domínio.
         */

        if(
            href.indexOf(
                "https://noveflix.lol/"
            )!==0
        ){
            continue;
        }


        if(usados[href]){
            continue;
        }


        usados[href]=true;


        lista.push({

            titulo:
                texto
                ||
                "Episódio "+
                (lista.length+1),

            url:href

        });
    }


    return lista;
}


/* MOSTRA EPISÓDIOS */

function montarEpisodios(lista){

    var box =
        document.getElementById(
            "episodios"
        );


    box.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var botao =
            document.createElement(
                "button"
            );


        botao.className =
            "ep";


        botao.innerHTML=

            '<div class="epNumero">'+
            (i+1)+
            '</div>'+

            '<div class="epTexto">'+

            '<strong>'+
            esc(
                lista[i].titulo
            )+
            '</strong>'+

            '<span>'+
            'Página pública'+
            '</span>'+

            '</div>';


        box.appendChild(
            botao
        );
    }
}


/* BUSCA */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    filtradas=[];


    for(
        var i=0;
        i<novelas.length;
        i++
    ){

        if(
            novelas[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            )>=0
        ){

            filtradas.push(
                novelas[i]
            );
        }
    }


    montarGrade(
        filtradas
    );
}


/* UTIL */

function normalizar(url){

    if(!url){
        return "";
    }


    if(
        url.indexOf(
            "https://www.noveflix.lol/"
        )===0
    ){

        return url.replace(
            "https://www.noveflix.lol/",
            "https://noveflix.lol/"
        );
    }


    if(
        url.indexOf(
            "https://"
        )===0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        )===0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0)==="/"
    ){

        return "https://noveflix.lol"+url;
    }


    return "";
}


function limpar(texto){

    if(!texto){
        return "";
    }

    return String(texto)
        .replace(
            /\s+/g,
            " "
        )
        .replace(
            /^\s+|\s+$/g,
            ""
        );
}


function esc(texto){

    if(!texto){
        return "";
    }

    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function status(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );

    box.className =
        "status";

    if(tipo){
        box.className +=
            " "+tipo;
    }

    box.innerHTML =
        esc(
            texto
        );
}


function info(texto){

    document
    .getElementById(
        "info"
    )
    .innerHTML =
        texto;
}


/* EVENTOS */

document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "voltar"
)
.addEventListener(
    "click",
    function(){

        document
        .getElementById(
            "novelaTela"
        )
        .style.display="none";

        document
        .getElementById(
            "catalogoTela"
        )
        .style.display="block";
    }
);


setTimeout(
    iniciar,
    700
);

</script>

</body>
</html>
