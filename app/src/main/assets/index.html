<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #292929;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.buscaBox{
    display:flex;
    margin:17px;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:white;
    padding:15px 18px;
    font-size:17px;
}

.buscaBox button{
    width:62px;
    border:0;
    background:#e31326;
    color:white;
    font-size:22px;
}

main{
    padding:17px;
}

.status{
    background:#1d1d20;
    border-radius:9px;
    padding:14px;
    margin-bottom:18px;
    color:#bbb;
    line-height:1.5;
}

.ok{
    color:#8cff9b;
}

.erro{
    color:#ff8585;
}

.titulo{
    display:flex;
    align-items:center;
    margin:20px 0 15px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:11px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;
}

.capa{
    height:175px;
    border-radius:7px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:9px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );
}

.capa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
}

.episodios{
    margin-top:3px;
    font-size:12px;
    color:#999;
}

#detalheTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;
    display:flex;
    align-items:center;
    padding:12px 16px;
    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#252525;
    color:white;
    font-size:27px;
    margin-right:13px;
}

.detalhes{
    padding:18px;
}

.painel{
    background:#1d1d20;
    border-radius:10px;
    padding:16px;
}

</style>
</head>

<body>

<div id="catalogoTela">

<div class="topo">
    <div class="logo">
        <span class="logo1">NOVELAS</span><span class="logo2">PLAY</span>
    </div>
</div>

<div class="buscaBox">

    <input
        id="busca"
        placeholder="Pesquisar novela turca...">

    <button id="btnBusca">
        🔍
    </button>

</div>

<main>

<div id="status" class="status">
    Carregando AssistirFarah...
</div>

<div class="titulo">
    <div class="linha"></div>
    Novelas Turcas
</div>

<div id="grade" class="grade"></div>

</main>

</div>


<div id="detalheTela">

<div class="subTopo">

    <button
        id="voltar"
        class="voltar">
        ‹
    </button>

    <strong id="tituloTopo">
        Novela
    </strong>

</div>

<div class="detalhes">

    <div class="painel">

        <h2 id="tituloDetalhe">
            Novela
        </h2>

        <div id="infoDetalhe">
            Carregando...
        </div>

    </div>

</div>

</div>


<script>

var URL =
    "https://assistirfarah.com/";

var catalogo = [];

var exibindo = [];


function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        status(
            "AndroidSite não encontrado.",
            "erro"
        );

        return;
    }

    status(
        "Buscando catálogo do AssistirFarah..."
    );

    AndroidSite.get(
        URL,
        "receberCatalogo"
    );
}


function receberCatalogo(
    codigo,
    html,
    erro
){

    if(erro){

        status(
            erro,
            "erro"
        );

        return;
    }

    if(
        codigo < 200 ||
        codigo >= 400
    ){

        status(
            "HTTP "+codigo,
            "erro"
        );

        return;
    }

    catalogo =
        extrair(
            html
        );

    exibindo =
        catalogo.slice(0);

    status(
        catalogo.length+
        " títulos encontrados ✅",
        "ok"
    );

    montar(
        exibindo
    );
}


function extrair(html){

    var doc =
        new DOMParser()
        .parseFromString(
            html,
            "text/html"
        );

    var links =
        doc.querySelectorAll(
            "a[href]"
        );

    var lista = [];

    var usados = {};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];

        var href =
            a.getAttribute(
                "href"
            )
            ||
            "";


        href =
            normalizar(
                href
            );


        if(
            !href ||
            href === URL
        ){
            continue;
        }


        /*
         * Descarta navegação geral.
         */
        if(
            href.indexOf(
                "#"
            ) >= 0
        ){
            continue;
        }


        var texto =
            limpar(
                a.textContent
            );


        var img =
            a.querySelector(
                "img"
            );


        var alt="";

        if(img){

            alt =
                limpar(
                    img.getAttribute(
                        "alt"
                    )
                );
        }


        var bloco =
            a.parentNode;


        var textoBloco =
            bloco
            ?
            limpar(
                bloco.textContent
            )
            :
            texto;


        /*
         * O catálogo público usa
         * "XX episódios".
         */
        var match =
            textoBloco.match(
                /(\d+)\s*epis[oó]dios?/i
            );


        if(!match){
            continue;
        }


        var nome =
            alt || texto;


        if(!nome){
            continue;
        }


        /*
         * Remove texto extra depois
         * do número de episódios.
         */
        nome =
            nome
            .replace(
                /\s*Completa.*$/i,
                ""
            )
            .replace(
                /\s*\d+\s*epis[oó]dios?.*$/i,
                ""
            );


        nome =
            limpar(
                nome
            );


        if(
            nome.length < 3
        ){
            continue;
        }


        var chave =
            nome.toLowerCase();


        if(
            usados[chave]
        ){
            continue;
        }


        var capa="";


        if(img){

            capa =
                img.getAttribute(
                    "data-src"
                )
                ||
                img.getAttribute(
                    "data-lazy-src"
                )
                ||
                img.getAttribute(
                    "src"
                )
                ||
                "";
        }


        usados[chave]=true;


        lista.push({

            nome:nome,

            episodios:
                match[1],

            url:href,

            capa:capa

        });
    }


    return lista;
}


function montar(lista){

    var grade =
        document.getElementById(
            "grade"
        );

    grade.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var item =
            lista[i];

        var card =
            document.createElement(
                "div"
            );

        card.className=
            "card";


        var capa="";


        if(
            item.capa &&
            item.capa.indexOf(
                "http"
            ) === 0
        ){

            capa =
                '<img src="' +
                esc(
                    item.capa
                ) +
                '" alt="">';

        }else{

            capa =
                esc(
                    item.nome
                );
        }


        card.innerHTML=

            '<div class="capa">'+
            capa+
            '</div>'+

            '<div class="nome">'+
            esc(
                item.nome
            )+
            '</div>'+

            '<div class="episodios">'+
            item.episodios+
            ' episódios'+
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                abrir(
                    exibindo[
                        parseInt(
                            this.getAttribute(
                                "data-index"
                            )
                        )
                    ]
                );
            };


        grade.appendChild(
            card
        );
    }
}


function abrir(item){

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "detalheTela"
    )
    .style.display=
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "tituloDetalhe"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "infoDetalhe"
    )
    .innerHTML=

        item.episodios+
        " episódios encontrados.<br><br>"+
        "Página pública:<br>"+
        esc(
            item.url
        );
}


function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    exibindo=[];


    for(
        var i=0;
        i<catalogo.length;
        i++
    ){

        if(
            catalogo[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            exibindo.push(
                catalogo[i]
            );
        }
    }


    montar(
        exibindo
    );
}


function normalizar(url){

    if(!url){
        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0) === "/"
    ){

        return "https://assistirfarah.com"+url;
    }


    return "";
}


function limpar(texto){

    if(!texto){
        return "";
    }

    return String(texto)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^\s+|\s+$/g,
            ""
        );
}


function esc(texto){

    if(!texto){
        return "";
    }

    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function status(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );


    box.className =
        "status";


    if(tipo){

        box.className +=
            " "+tipo;
    }


    box.innerHTML=
        esc(
            texto
        );
}


document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "voltar"
)
.addEventListener(
    "click",
    function(){

        document
        .getElementById(
            "detalheTela"
        )
        .style.display=
            "none";


        document
        .getElementById(
            "catalogoTela"
        )
        .style.display=
            "block";
    }
);


setTimeout(
    iniciar,
    500
);

</script>

</body>
</html>
