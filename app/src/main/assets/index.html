<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #292929;
}

.menu{
    position:absolute;
    left:20px;
    font-size:30px;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.barraBusca{
    padding:17px;
    background:#101011;
    border-bottom:7px solid #222;
}

.buscaBox{
    display:flex;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:#fff;
    padding:15px 18px;
    font-size:17px;
}

.btnBusca{
    width:62px;
    border:0;
    background:#e31326;
    color:#fff;
    font-size:24px;
}

main{
    padding:17px;
}

.status{
    background:#1d1d20;
    border-radius:8px;
    padding:13px;
    margin-bottom:16px;
    color:#bbb;
    line-height:1.4;
}

.status.ok{
    color:#8cff9b;
}

.status.erro{
    color:#ff7e7e;
}

.tituloSecao{
    display:flex;
    align-items:center;
    margin:20px 0 16px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:12px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;
}

.cardCapa{
    height:175px;
    border-radius:6px;
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.cardCapa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.semImagem{
    padding:9px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.cardNome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.cardAno{
    margin-top:3px;
    font-size:12px;
    color:#999;
}


/* TELA DA NOVELA */

#novelaTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;
    display:flex;
    align-items:center;
    padding:12px 16px;
    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#252525;
    color:#fff;
    font-size:27px;
    margin-right:13px;
}

.subTitulo strong{
    display:block;
    font-size:19px;
}

.subTitulo span{
    color:#aaa;
    font-size:13px;
}

.detalhes{
    padding:18px;
}

.detalheBox{
    background:#1d1d20;
    border-radius:9px;
    padding:16px;
}

.detalheBox h2{
    margin:0 0 8px;
    font-size:22px;
}

.detalheAno{
    color:#aaa;
    margin-bottom:15px;
}

.info{
    color:#bbb;
    line-height:1.5;
}

</style>
</head>

<body>


<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">

    <div class="menu">☰</div>

    <div class="logo">
        <span class="logo1">NOVELAS</span><span class="logo2">PLAY</span>
    </div>

</div>


<div class="barraBusca">

    <div class="buscaBox">

        <input
            id="busca"
            placeholder="Pesquisar novela...">

        <button
            id="btnBusca"
            class="btnBusca">
            🔍
        </button>

    </div>

</div>


<main>

<div
    id="status"
    class="status">

    Carregando catálogo...

</div>


<div class="tituloSecao">

    <div class="linha"></div>

    Novelas

</div>


<div
    id="grade"
    class="grade">
</div>

</main>

</div>



<!-- DETALHES DA NOVELA -->

<div id="novelaTela">

<div class="subTopo">

    <button
        id="voltarCatalogo"
        class="voltar">
        ‹
    </button>

    <div class="subTitulo">

        <strong id="tituloTopo">
            Novela
        </strong>

        <span>
            NovelasPlay
        </span>

    </div>

</div>


<div class="detalhes">

    <div class="detalheBox">

        <h2 id="tituloNovela">
            Novela
        </h2>

        <div
            id="anoNovela"
            class="detalheAno">
        </div>

        <div
            id="infoNovela"
            class="info">

            Carregando página...

        </div>

    </div>

</div>

</div>


<script>

var URL_CATALOGO =
    "https://noveflix.lol/categoria/novelas/";

var novelas = [];

var novelasFiltradas = [];


/*
 * COMEÇA A BUSCA
 */

function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        mostrarStatus(
            "ERRO: ponte AndroidSite não encontrada.",
            "erro"
        );

        return;
    }

    mostrarStatus(
        "Buscando novelas no site..."
    );

    AndroidSite.get(
        URL_CATALOGO,
        "receberCatalogo"
    );
}


/*
 * RECEBE HTML DO CATÁLOGO
 */

function receberCatalogo(
    status,
    html,
    erro
){

    if(erro){

        mostrarStatus(
            erro,
            "erro"
        );

        return;
    }

    if(
        status < 200 ||
        status >= 400
    ){

        mostrarStatus(
            "Servidor respondeu HTTP "
            + status,
            "erro"
        );

        return;
    }

    novelas =
        extrairNovelas(
            html
        );

    novelasFiltradas =
        novelas.slice(0);

    if(
        novelas.length === 0
    ){

        mostrarStatus(
            "A página carregou, mas não consegui encontrar as novelas no HTML.",
            "erro"
        );

        return;
    }

    mostrarStatus(
        novelas.length +
        " novelas encontradas.",
        "ok"
    );

    montarGrade(
        novelas
    );
}


/*
 * EXTRAI OS CARDS DA PÁGINA
 */

function extrairNovelas(html){

    var resultado = [];

    var encontrados = {};

    var parser =
        new DOMParser();

    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    var links =
        doc.querySelectorAll(
            'a[href]'
        );


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var link =
            links[i];

        var href =
            link.getAttribute(
                "href"
            ) || "";

        /*
         * Páginas individuais do catálogo.
         */
        if(
            href.indexOf(
                "noveflix.lol/assista/"
            ) === -1
        ){
            continue;
        }

        if(
            encontrados[href]
        ){
            continue;
        }

        var nome =
            limparTexto(
                link.textContent
            );

        var imagem =
            link.querySelector(
                "img"
            );

        if(
            !nome &&
            imagem
        ){

            nome =
                imagem.getAttribute(
                    "alt"
                ) || "";
        }

        nome =
            limparTexto(
                nome
            );

        if(!nome){
            continue;
        }

        /*
         * Procura dados perto do link.
         */
        var bloco =
            link.parentNode;

        var textoBloco = "";

        if(bloco){

            textoBloco =
                limparTexto(
                    bloco.textContent
                );
        }

        var ano = "";

        var matchAno =
            textoBloco.match(
                /\b(19|20)\d{2}\b/
            );

        if(matchAno){
            ano =
                matchAno[0];
        }

        var capa = "";

        if(imagem){

            capa =
                imagem.getAttribute(
                    "data-src"
                )
                ||
                imagem.getAttribute(
                    "data-lazy-src"
                )
                ||
                imagem.getAttribute(
                    "src"
                )
                ||
                "";
        }

        encontrados[href] =
            true;

        resultado.push({

            nome:nome,

            ano:ano,

            url:href,

            capa:capa

        });
    }

    return resultado;
}


function limparTexto(texto){

    if(!texto){
        return "";
    }

    return texto
        .replace(
            /\s+/g,
            " "
        )
        .replace(
            /^\s+|\s+$/g,
            ""
        );
}


/*
 * MONTA CATÁLOGO
 */

function montarGrade(lista){

    var box =
        document.getElementById(
            "grade"
        );

    box.innerHTML = "";

    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var novela =
            lista[i];

        var card =
            document.createElement(
                "div"
            );

        card.className =
            "card";


        var capaHtml = "";

        if(
            novela.capa &&
            novela.capa.indexOf(
                "http"
            ) === 0
        ){

            capaHtml =
                '<img src="' +
                escaparHtml(
                    novela.capa
                ) +
                '" alt="">';

        }else{

            capaHtml =
                '<div class="semImagem">' +
                escaparHtml(
                    novela.nome
                ) +
                '</div>';
        }


        card.innerHTML =

            '<div class="cardCapa">' +
            capaHtml +
            '</div>' +

            '<div class="cardNome">' +
            escaparHtml(
                novela.nome
            ) +
            '</div>' +

            '<div class="cardAno">' +
            escaparHtml(
                novela.ano
            ) +
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                var indice =
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    );

                abrirNovela(
                    novelasFiltradas[
                        indice
                    ]
                );
            };


        box.appendChild(
            card
        );
    }
}


/*
 * BUSCA LOCAL
 */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    novelasFiltradas = [];


    for(
        var i=0;
        i<novelas.length;
        i++
    ){

        if(
            novelas[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            novelasFiltradas.push(
                novelas[i]
            );
        }
    }


    montarGrade(
        novelasFiltradas
    );
}


/*
 * ABRE PÁGINA EM SEGUNDO PLANO
 * NÃO ABRE O SITE NA TELA
 */

function abrirNovela(novela){

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML =
        escaparHtml(
            novela.nome
        );


    document
    .getElementById(
        "tituloNovela"
    )
    .innerHTML =
        escaparHtml(
            novela.nome
        );


    document
    .getElementById(
        "anoNovela"
    )
    .innerHTML =
        escaparHtml(
            novela.ano
        );


    document
    .getElementById(
        "infoNovela"
    )
    .innerHTML =
        "Carregando informações...";


    AndroidSite.get(
        novela.url,
        "receberNovela"
    );
}


/*
 * RECEBE PÁGINA DA NOVELA
 */

function receberNovela(
    status,
    html,
    erro
){

    if(erro){

        document
        .getElementById(
            "infoNovela"
        )
        .innerHTML =
            escaparHtml(
                erro
            );

        return;
    }


    if(
        status < 200 ||
        status >= 400
    ){

        document
        .getElementById(
            "infoNovela"
        )
        .innerHTML =
            "HTTP " +
            status;

        return;
    }


    var parser =
        new DOMParser();

    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    var h1 =
        doc.querySelector(
            "h1"
        );


    if(h1){

        document
        .getElementById(
            "tituloNovela"
        )
        .innerHTML =
            escaparHtml(
                limparTexto(
                    h1.textContent
                )
            );
    }


    document
    .getElementById(
        "infoNovela"
    )
    .innerHTML =
        "Página carregada dentro do NovelasPlay ✅<br><br>" +
        "No próximo passo vamos identificar a lista pública de capítulos/episódios desta página.";
}


/*
 * VOLTAR
 */

function voltar(){

    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "block";
}


function mostrarStatus(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );

    box.className =
        "status";

    if(tipo){
        box.className +=
            " " + tipo;
    }

    box.innerHTML =
        escaparHtml(
            texto
        );
}


function escaparHtml(texto){

    if(!texto){
        return "";
    }

    return texto
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "voltarCatalogo"
)
.addEventListener(
    "click",
    voltar
);


setTimeout(
    iniciar,
    700
);

</script>

</body>
</html>
