<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>NovelasPlay Motor Teste</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,
input{
    font-family:Arial,sans-serif;
}

.topo{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    border-bottom:2px solid #e31b36;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span:first-child{
    color:#e31b36;
}

.busca{
    display:flex;
    padding:15px;
    background:#151515;
}

.busca input{
    flex:1;
    min-width:0;
    padding:14px;
    border:0;
    border-radius:25px 0 0 25px;
    background:#050505;
    color:#fff;
    font-size:16px;
}

.busca button{
    width:60px;
    border:0;
    border-radius:0 25px 25px 0;
    background:#e31b36;
    color:#fff;
    font-size:20px;
}

main{
    padding:16px;
}

.status{
    padding:14px;
    margin-bottom:16px;
    border-radius:9px;
    background:#202024;
    color:#bbb;
    line-height:1.5;
    word-break:break-word;
}

.ok{
    color:#8dff9c;
}

.erro{
    color:#ff8585;
}

.titulo{
    font-size:22px;
    font-weight:bold;
    margin:20px 0 15px;
    display:flex;
    align-items:center;
}

.linha{
    width:5px;
    height:30px;
    background:#e31b36;
    margin-right:10px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;
}

.capa{
    height:170px;
    border-radius:7px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #61131e,
            #18181b 55%,
            #9b172a
        );
}

.capa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ano{
    color:#999;
    font-size:12px;
    margin-top:3px;
}


/* TELA NOVELA */

#novelaTela{
    display:none;
}

.subTopo{
    min-height:68px;
    display:flex;
    align-items:center;
    padding:12px;
    background:#111;
    border-bottom:2px solid #e31b36;
}

.voltar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    margin-right:12px;
    background:#292929;
    color:#fff;
    font-size:26px;
}

.subTitulo strong{
    display:block;
    font-size:18px;
}

.subTitulo span{
    color:#999;
    font-size:12px;
}

.painel{
    margin:16px;
    padding:16px;
    background:#1c1c20;
    border-radius:10px;
}

.painel h2{
    margin-top:0;
}

.resultado{
    margin-top:15px;
    padding:14px;
    background:#101014;
    border-radius:8px;
    color:#bbb;
    line-height:1.5;
    word-break:break-word;
}

.botaoTeste{
    width:100%;
    min-height:50px;
    margin-top:12px;
    border:0;
    border-radius:7px;
    background:#e31b36;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

</style>

</head>

<body>


<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">

    <div class="logo">
        <span>NOVELAS</span><span>PLAY</span>
    </div>

</div>


<div class="busca">

    <input
        id="campoBusca"
        placeholder="Pesquisar novela...">

    <button id="btnBusca">
        🔍
    </button>

</div>


<main>

<div
    id="status"
    class="status">

    Inicializando motor...

</div>


<div class="titulo">

    <div class="linha"></div>

    Novelas

</div>


<div
    id="grade"
    class="grade">
</div>

</main>

</div>



<!-- NOVELA -->

<div id="novelaTela">

<div class="subTopo">

    <button
        id="btnVoltar"
        class="voltar">

        ‹

    </button>

    <div class="subTitulo">

        <strong id="tituloTopo">
            Novela
        </strong>

        <span id="modoTopo">
            NovelasPlay
        </span>

    </div>

</div>


<div class="painel">

    <h2 id="tituloNovela">
        Novela
    </h2>


    <div
        id="resultado"
        class="resultado">

        Carregando...

    </div>


    <button
        id="btnRender"
        class="botaoTeste">

        Testar ASSISTIR renderizado

    </button>

</div>

</div>



<script>

var URL_CATALOGO =
    "https://noveflix.lol/categoria/novelas/";

var novelas = [];

var filtradas = [];

var novelaAtual = null;



/*
 * ==========================================
 * DESCOBRE O MODO
 * ==========================================
 */

function modoAPK(){

    return (
        typeof AndroidSite !==
        "undefined"
    );
}


function modoRenderAPK(){

    return (
        typeof AndroidRendered !==
        "undefined"
    );
}



/*
 * ==========================================
 * REQUISIÇÃO HÍBRIDA
 * ==========================================
 */

function baixarPagina(
    url,
    callback
){

    /*
     * APK
     */
    if(
        modoAPK()
    ){

        AndroidSite.get(
            url,
            callback
        );

        return;
    }


    /*
     * NAVEGADOR NORMAL
     */

    mostrarStatus(
        "Modo navegador: tentando baixar página pública..."
    );


    fetch(
        url,
        {
            method:"GET"
        }
    )

    .then(
        function(resposta){

            return resposta
                .text()
                .then(
                    function(texto){

                        window[
                            callback
                        ](
                            resposta.status,
                            texto,
                            ""
                        );
                    }
                );
        }
    )

    .catch(
        function(erro){

            window[
                callback
            ](
                0,
                "",
                "O navegador bloqueou a leitura. "+
                "Provavelmente CORS: "+
                erro
            );
        }
    );
}



/*
 * ==========================================
 * INÍCIO
 * ==========================================
 */

function iniciar(){

    if(
        modoAPK()
    ){

        mostrarStatus(
            "Modo APK ✅ Buscando catálogo..."
        );

    }else{

        mostrarStatus(
            "Modo navegador 🌐 Testando catálogo..."
        );
    }


    baixarPagina(
        URL_CATALOGO,
        "receberCatalogo"
    );
}



/*
 * ==========================================
 * CATÁLOGO
 * ==========================================
 */

function receberCatalogo(
    codigo,
    html,
    erro
){

    if(erro){

        mostrarStatus(
            erro,
            "erro"
        );

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        mostrarStatus(
            "HTTP "+codigo,
            "erro"
        );

        return;
    }


    novelas =
        extrairNovelas(
            html
        );


    filtradas =
        novelas.slice(0);


    if(
        novelas.length===0
    ){

        mostrarStatus(
            "A página abriu, mas nenhuma novela foi encontrada no HTML.",
            "erro"
        );

        return;
    }


    mostrarStatus(
        novelas.length+
        " novelas encontradas ✅",
        "ok"
    );


    montarGrade(
        filtradas
    );
}



function extrairNovelas(
    html
){

    var parser =
        new DOMParser();


    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var lista=[];

    var usados={};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];


        var href =
            normalizar(
                a.getAttribute(
                    "href"
                )
            );


        if(
            href.indexOf(
                "https://noveflix.lol/assista/"
            ) !== 0
        ){

            continue;
        }


        if(
            usados[href]
        ){

            continue;
        }


        var img =
            a.querySelector(
                "img"
            );


        var nome =
            limpar(
                a.textContent
            );


        if(
            !nome &&
            img
        ){

            nome =
                limpar(
                    img.getAttribute(
                        "alt"
                    )
                );
        }


        if(!nome){
            continue;
        }


        var capa="";


        if(img){

            capa =
                img.getAttribute(
                    "data-src"
                )
                ||
                img.getAttribute(
                    "data-lazy-src"
                )
                ||
                img.getAttribute(
                    "src"
                )
                ||
                "";
        }


        var textoPai="";


        if(
            a.parentNode
        ){

            textoPai =
                limpar(
                    a.parentNode
                    .textContent
                );
        }


        var ano="";


        var achouAno =
            textoPai.match(
                /\b(19|20)\d{2}\b/
            );


        if(achouAno){

            ano =
                achouAno[0];
        }


        usados[href]=true;


        lista.push({

            nome:nome,

            ano:ano,

            capa:capa,

            url:href

        });
    }


    return lista;
}



/*
 * ==========================================
 * CARDS
 * ==========================================
 */

function montarGrade(
    lista
){

    var grade =
        document.getElementById(
            "grade"
        );


    grade.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var novela =
            lista[i];


        var card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        var capa="";


        if(
            novela.capa &&
            novela.capa.indexOf(
                "http"
            ) === 0
        ){

            capa =
                '<img src="' +
                esc(
                    novela.capa
                ) +
                '" alt="">';

        }else{

            capa =
                esc(
                    novela.nome
                );
        }


        card.innerHTML=

            '<div class="capa">'+
            capa+
            '</div>'+

            '<div class="nome">'+
            esc(
                novela.nome
            )+
            '</div>'+

            '<div class="ano">'+
            esc(
                novela.ano
            )+
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                var indice =
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    );


                abrirNovela(
                    filtradas[
                        indice
                    ]
                );
            };


        grade.appendChild(
            card
        );
    }
}



/*
 * ==========================================
 * NOVELA
 * ==========================================
 */

function abrirNovela(
    novela
){

    novelaAtual =
        novela;


    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "novelaTela"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML =
        esc(
            novela.nome
        );


    document
    .getElementById(
        "tituloNovela"
    )
    .innerHTML =
        esc(
            novela.nome
        );


    document
    .getElementById(
        "resultado"
    )
    .innerHTML =
        "Baixando página da novela...";


    baixarPagina(
        novela.url,
        "receberNovela"
    );
}



function receberNovela(
    codigo,
    html,
    erro
){

    if(erro){

        resultado(
            erro
        );

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        resultado(
            "HTTP "+codigo
        );

        return;
    }


    var parser =
        new DOMParser();


    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var assistir=[];


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var texto =
            limpar(
                links[i]
                .textContent
            );


        if(
            texto
            .toLowerCase()
            .indexOf(
                "assistir"
            ) >= 0
        ){

            assistir.push(

                normalizar(
                    links[i]
                    .getAttribute(
                        "href"
                    )
                )

            );
        }
    }


    if(
        assistir.length > 0
    ){

        resultado(
            "HTML carregado ✅<br><br>"+
            "ASSISTIR encontrado no HTML:<br>"+
            esc(
                assistir[0]
            )
        );

    }else{

        resultado(
            "HTML carregado ✅<br><br>"+
            "Nenhum link ASSISTIR apareceu no HTML bruto."
        );
    }
}



/*
 * ==========================================
 * TESTE RENDERIZADO
 * ==========================================
 */

function testarRenderizado(){

    if(
        !novelaAtual
    ){
        return;
    }


    if(
        !modoRenderAPK()
    ){

        resultado(
            "No navegador comum não existe AndroidRendered.<br><br>"+
            "Esse teste só funciona dentro do APK."
        );

        return;
    }


    resultado(
        "Renderizando página com JavaScript..."
    );


    AndroidRendered.findAssistir(

        novelaAtual.url,

        "receberAssistirRenderizado"

    );
}



function receberAssistirRenderizado(
    url,
    erro
){

    if(erro){

        resultado(
            erro
        );

        return;
    }


    if(!url){

        resultado(
            "Nenhuma página pública de ASSISTIR foi encontrada."
        );

        return;
    }


    resultado(
        "ASSISTIR encontrado ✅<br><br>"+
        esc(
            url
        )
    );
}



/*
 * ==========================================
 * BUSCA
 * ==========================================
 */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "campoBusca"
        )
        .value
        .toLowerCase();


    filtradas=[];


    for(
        var i=0;
        i<novelas.length;
        i++
    ){

        if(
            novelas[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            filtradas.push(
                novelas[i]
            );
        }
    }


    montarGrade(
        filtradas
    );
}



/*
 * ==========================================
 * UTIL
 * ==========================================
 */

function normalizar(
    url
){

    if(!url){
        return "";
    }


    url =
        String(url);


    if(
        url.indexOf(
            "https://www.noveflix.lol/"
        ) === 0
    ){

        return url.replace(
            "https://www.noveflix.lol/",
            "https://noveflix.lol/"
        );
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0) === "/"
    ){

        return "https://noveflix.lol"+url;
    }


    return "";
}



function limpar(
    texto
){

    if(!texto){
        return "";
    }


    return String(texto)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^\s+|\s+$/g,
            ""
        );
}



function esc(
    texto
){

    if(!texto){
        return "";
    }


    return String(texto)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}



function mostrarStatus(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );


    box.className =
        "status";


    if(tipo){

        box.className +=
            " "+tipo;
    }


    box.innerHTML =
        esc(
            texto
        );
}



function resultado(
    texto
){

    document
    .getElementById(
        "resultado"
    )
    .innerHTML =
        texto;
}



/*
 * ==========================================
 * EVENTOS
 * ==========================================
 */

document
.getElementById(
    "campoBusca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "btnRender"
)
.addEventListener(
    "click",
    testarRenderizado
);


document
.getElementById(
    "btnVoltar"
)
.addEventListener(
    "click",
    function(){

        document
        .getElementById(
            "novelaTela"
        )
        .style.display =
            "none";

        document
        .getElementById(
            "catalogoTela"
        )
        .style.display =
            "block";
    }
);


setTimeout(
    iniciar,
    500
);

</script>

</body>
</html>
