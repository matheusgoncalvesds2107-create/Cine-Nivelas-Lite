<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinenovelas Lite</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #17171b;
      padding: 18px 16px;
      font-size: 20px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .subtitulo {
      color: #999;
      font-size: 12px;
      padding: 12px 16px 0;
    }

    .busca {
      margin: 14px 16px;
    }

    .busca input {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #24242b;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .status {
      margin: 10px 16px;
      padding: 12px;
      background: #18181d;
      border-radius: 10px;
      font-size: 13px;
      color: #bbb;
    }

    .titulo {
      padding: 5px 16px 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 80px;
    }

    .card {
      background: #1a1a20;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #292930;
    }

    .card .nome {
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .erro {
      color: #ff8a8a;
    }

    .episodios {
      padding: 16px;
    }

    .episodio {
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #202027;
    }

    button {
      background: #ffffff;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 8px 0;
      font-weight: bold;
    }

    .voltar {
      margin: 10px 16px;
    }
  </style>
</head>

<body>

<header>CINENOVELAS LITE</header>

<div id="telaCatalogo">

  <div class="subtitulo">
    Versão leve para Android 6
  </div>

  <div class="busca">
    <input
      id="pesquisa"
      type="text"
      placeholder="Pesquisar novelas..."
      onkeyup="filtrar()"
    >
  </div>

  <div id="status" class="status">
    Car
