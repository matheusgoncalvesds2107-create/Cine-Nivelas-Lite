<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #292929;
}

}

    color:#ef1741;
}

.logo2{

}

    display:flex;
    margin:17px;

    overflow:hidden;
}

    min-width:0;
    border:0;

.status{

    color:#bbb;
    line-height:1.5;
}

.ok{
    color:#8cff9b;
}

.erro{
    color:#ff8585;
}

.titulo{
    display:flex;
    align-items:center;
    margin:20px 0 15px;
    font-size:23px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:34px;
    background:#ef1837;
    margin-right:11px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;

    height:175px;
    border-radius:7px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );

.capa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nome{
    margin-top:7px;
    font-size:14px;

}

.episodios{
    margin-top:4px;
    font-size:12px;
    color:#999;
}

#detalheTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;
    display:flex;

    padding:12px 16px;

    height:44px;

    border:0;
    border-radius:50%;

    font-size:18px;
    font-weight:bold;
}

.detalhes{
    padding:18px;
}

.painel{
    background:#1d1d20;
    border-radius:10px;
    padding:16px;
}

.painel h2{
    margin-top:0;
}

.info{
    color:#bbb;
    line-height:1.5;
}


/* EPISÓDIOS */

.listaEpisodios{
    margin-top:18px;
}

.ep{
    width:100%;
    min-height:55px;
    border:0;
    border-radius:8px;
    margin-bottom:9px;
    padding:12px 14px;

    background:#29292c;
    color:white;

    text-align:left;
    font-size:16px;
    font-weight:bold;
}

.ep:active{
    background:#e31326;
}

.carregando{
    color:#aaa;
    margin-top:18px;
}

</style>

<body>


<!-- CATÁLOGO -->

<div id="catalogoTela">

<div class="topo">

    <div class="logo">

        <span class="logo1">
            NOVELAS
        </span><span class="logo2">PLAY</span>

    </div>

</div>


<div class="buscaBox">

    <input
        id="busca"
        placeholder="Pesquisar novela turca...">

    <button id="btnBusca">
        🔍
    </button>

</div>


<main>

<div id="status" class="status">
    Carregando catálogo...
</div>


<div class="titulo">

    <div class="linha"></div>

    Novelas Turcas

</div>


<div id="grade" class="grade">
</div>

</main>

</div>



<!-- DETALHES -->

<div id="detalheTela">

<div class="subTopo">

    <button
        id="voltar"
        class="voltar">
        ‹
    </button>

    <div
        id="tituloTopo"
        class="tituloTopo">

        Novela

    </div>

</div>


<div class="detalhes">

    <div class="painel">

        <h2 id="tituloDetalhe">
            Novela
        </h2>

        <div
            id="infoDetalhe"
            class="info">
        </div>

    </div>


    <div
        id="listaEpisodios"
        class="listaEpisodios">
    </div>

</div>

</div>



<script>

var URL_BASE =
    "https://assistirfarah.com/";

var catalogo = [];

var exibindo = [];

var novelaAtual = null;


/*
 * =====================================
 * INÍCIO
 * =====================================
 */

function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        definirStatus(
            "AndroidSite não encontrado.",
            "erro"
        );

        return;
    }


    definirStatus(
        "Buscando catálogo..."
    );


    AndroidSite.get(
        URL_BASE,
        "receberCatalogo"
    );
}



/*
 * =====================================
 * RECEBE CATÁLOGO
 * =====================================
 */

function receberCatalogo(
    codigo,
    html,
    erro
){

    if(erro){

        definirStatus(
            erro,
            "erro"
        );

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        definirStatus(
            "Erro HTTP "+codigo,
            "erro"
        );

        return;
    }


    catalogo =
        extrairCatalogo(
            html
        );


    exibindo =
        catalogo.slice(0);


    definirStatus(
        catalogo.length+
        " títulos encontrados ✅",
        "ok"
    );


    montarGrade(
        exibindo
    );
}



/*
 * =====================================
 * EXTRAI CATÁLOGO
 * =====================================
 */

function extrairCatalogo(
    html
){

    var doc =
        new DOMParser()
        .parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var lista = [];

    var usados = {};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];


        var href =
            normalizarUrl(
                a.getAttribute(
                    "href"
                )
            );


        if(!href){
            continue;
        }


        if(
            href === URL_BASE
        ){
            continue;
        }


        var textoBloco =
            limpar(
                a.textContent
            );


        var pai =
            a.parentNode;


        if(pai){

            var textoPai =
                limpar(
                    pai.textContent
                );


            if(
                textoPai.length >
                textoBloco.length
            ){

                textoBloco =
                    textoPai;
            }
        }


        var match =
            textoBloco.match(
                /(\d+)\s*epis[oó]dios?/i
            );


        if(!match){

            continue;
        }


        var nome =
            extrairNome(
                a,
                textoBloco
            );


        if(
            !nome ||
            nome.length < 2
        ){

            continue;
        }


        var chave =
            href.toLowerCase();


        if(
            usados[chave]
        ){

            continue;
        }


        var img =
            a.querySelector(
                "img"
            );


        var capa="";


        if(img){

            capa =

                img.getAttribute(
                    "data-src"
                )

                ||

                img.getAttribute(
                    "data-lazy-src"
                )

                ||

                img.getAttribute(
                    "src"
                )

                ||

                "";
        }


        capa =
            normalizarImagem(
                capa
            );


        usados[chave] =
            true;


        lista.push({

            nome:nome,

            url:href,

            capa:capa,

            episodios:
                parseInt(
                    match[1]
                )

        });
    }


    return lista;
}



/*
 * =====================================
 * LIMPA NOME DUPLICADO
 * =====================================
 */

function extrairNome(
    a,
    textoBloco
){

    var candidatos=[];


    /*
     * Primeiro procura elementos
     * específicos de título.
     */
    var elementos =
        a.querySelectorAll(
            "h1,h2,h3,h4,h5,strong,b,[class*='title'],[class*='titulo'],[class*='name'],[class*='nome']"
        );


    for(
        var i=0;
        i<elementos.length;
        i++
    ){

        var t =
            limpar(
                elementos[i]
                .textContent
            );


        if(
            tituloValido(t)
        ){

            candidatos.push(
                t
            );
        }
    }


    /*
     * ALT da imagem.
     */
    var img =
        a.querySelector(
            "img"
        );


    if(img){

        var alt =
            limpar(
                img.getAttribute(
                    "alt"
                )
            );


        if(
            tituloValido(alt)
        ){

            candidatos.push(
                alt
            );
        }
    }


    /*
     * TITLE do link.
     */
    var title =
        limpar(
            a.getAttribute(
                "title"
            )
        );


    if(
        tituloValido(title)
    ){

        candidatos.push(
            title
        );
    }


    /*
     * Remove candidatos iguais.
     */
    var unicos=[];


    for(
        var c=0;
        c<candidatos.length;
        c++
    ){

        var existe=false;


        for(
            var u=0;
            u<unicos.length;
            u++
        ){

            if(
                unicos[u]
                .toLowerCase()
                ===
                candidatos[c]
                .toLowerCase()
            ){

                existe=true;
                break;
            }
        }


        if(!existe){

            unicos.push(
                candidatos[c]
            );
        }
    }


    /*
     * Quando existem dois títulos
     * no card, normalmente o segundo
     * é o título usado em português.
     */
    if(
        unicos.length >= 2
    ){

        return limparNomeFinal(
            unicos[
                unicos.length-1
            ]
        );
    }


    if(
        unicos.length === 1
    ){

        return limparNomeFinal(
            unicos[0]
        );
    }


    /*
     * Fallback:
     * usa o texto do bloco.
     */
    var bruto =
        textoBloco;


    bruto =
        bruto.replace(
            /\bCompleta\b.*$/i,
            ""
        );


    bruto =
        bruto.replace(
            /\d+\s*epis[oó]dios?.*$/i,
            ""
        );


    return limparNomeFinal(
        bruto
    );
}



function tituloValido(
    texto
){

    if(!texto){
        return false;
    }


    texto =
        limpar(
            texto
        );


    if(
        texto.length < 2 ||
        texto.length > 100
    ){

        return false;
    }


    if(
        /epis[oó]dios?|completa|legendado|dublado|r\$/i
        .test(texto)
    ){

        return false;
    }


    return true;
}



function limparNomeFinal(
    nome
){

    nome =
        limpar(
            nome
        );


    nome =
        nome.replace(
            /\bCompleta\b.*$/i,
            ""
        );


    nome =
        nome.replace(
            /\d+\s*epis[oó]dios?.*$/i,
            ""
        );


    /*
     * Caso simples:
     * "YargıYargı: Segredos..."
     */
    var metade =
        Math.floor(
            nome.length/2
        );


    /*
     * Remove repetição exata:
     * "Eşref RüyaEşref Rüya"
     */
    if(
        nome.length % 2 === 0
    ){

        var a =
            nome.substring(
                0,
                metade
            );


        var b =
            nome.substring(
                metade
            );


        if(
            a.toLowerCase() ===
            b.toLowerCase()
        ){

            nome = b;
        }
    }


    /*
     * Alguns títulos vêm no formato:
     * Original + tradução.
     *
     * Se houver ":" preservamos
     * a parte traduzida completa.
     */
    var posDoisPontos =
        nome.indexOf(
            ":"
        );


    if(
        posDoisPontos > 0
    ){

        var antes =
            nome.substring(
                0,
                posDoisPontos
            );


        /*
         * procura repetição do começo
         */
        var metadeAntes =
            Math.floor(
                antes.length/2
            );


        if(
            antes.length % 2 === 0
        ){

            var x =
                antes.substring(
                    0,
                    metadeAntes
                );


            var y =
                antes.substring(
                    metadeAntes
                );


            if(
                x.toLowerCase() ===
                y.toLowerCase()
            ){

                nome =
                    y+
                    nome.substring(
                        posDoisPontos
                    );
            }
        }
    }


    return limpar(
        nome
    );
}



/*
 * =====================================
 * GRADE
 * =====================================
 */

function montarGrade(
    lista
){

    var grade =
        document.getElementById(
            "grade"
        );


    grade.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var item =
            lista[i];


        var card =
            document.createElement(
                "div"
            );


        card.className=
            "card";


        var visual;


        if(item.capa){

            visual =

                '<img src="' +
                esc(item.capa) +
                '" alt="">';

        }else{

            visual =
                esc(
                    item.nome
                );
        }


        card.innerHTML =

            '<div class="capa">'+
                visual+
            '</div>'+

            '<div class="nome">'+
                esc(
                    item.nome
                )+
            '</div>'+

            '<div class="episodios">'+
                item.episodios+
                ' episódios'+
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                var indice =
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    );


                abrirNovela(
                    exibindo[
                        indice
                    ]
                );
            };


        grade.appendChild(
            card
        );
    }
}



/*
 * =====================================
 * ABRIR NOVELA
 * =====================================
 */

function abrirNovela(
    item
){

    novelaAtual =
        item;


    document
    .getElementById(
        "catalogoTela"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "detalheTela"
    )
    .style.display=
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "tituloDetalhe"
    )
    .innerHTML=
        esc(
            item.nome
        );


    document
    .getElementById(
        "infoDetalhe"
    )
    .innerHTML=

        item.episodios+
        " episódios no catálogo.";


    document
    .getElementById(
        "listaEpisodios"
    )
    .innerHTML=

        '<div class="carregando">'+
        'Buscando episódios...'+
        '</div>';


    AndroidSite.get(
        item.url,
        "receberPaginaNovela"
    );
}



/*
 * =====================================
 * PÁGINA DA NOVELA
 * =====================================
 */

function receberPaginaNovela(
    codigo,
    html,
    erro
){

    var box =
        document.getElementById(
            "listaEpisodios"
        );


    if(erro){

        box.innerHTML =

            '<div class="status erro">'+
            esc(erro)+
            '</div>';

        return;
    }


    if(
        codigo < 200 ||
        codigo >= 400
    ){

        box.innerHTML =

            '<div class="status erro">'+
            'Erro HTTP '+
            codigo+
            '</div>';

        return;
    }


    var episodios =
        extrairEpisodios(
            html
        );


    if(
        episodios.length === 0
    ){

        box.innerHTML =

            '<div class="status">'+
            'A página pública informa '+
            novelaAtual.episodios+
            ' episódios, mas não expõe '+
            'os links dos capítulos sem acesso à conta.'+
            '</div>';

        return;
    }


    montarEpisodios(
        episodios
    );
}



/*
 * =====================================
 * EXTRAIR EPISÓDIOS PÚBLICOS
 * =====================================
 */

function extrairEpisodios(
    html
){

    var doc =
        new DOMParser()
        .parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var lista=[];

    var usados={};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];


        var texto =
            limpar(
                a.textContent
            );


        var href =
            normalizarUrl(
                a.getAttribute(
                    "href"
                )
            );


        if(
            !href ||
            !texto
        ){

            continue;
        }


        /*
         * Só considera links que
         * realmente parecem episódios.
         */
        var pareceEpisodio =

            /epis[oó]dio\s*\d+/i
            .test(texto)

            ||

            /cap[ií]tulo\s*\d+/i
            .test(texto)

            ||

            /episode\s*\d+/i
            .test(texto)

            ||

            /episodio[-_\/]?\d+/i
            .test(href)

            ||

            /capitulo[-_\/]?\d+/i
            .test(href);


        if(
            !pareceEpisodio
        ){

            continue;
        }


        if(
            usados[href]
        ){

            continue;
        }


        usados[href]=true;


        lista.push({

            titulo:
                texto,

            url:
                href

        });
    }


    return lista;
}



/*
 * =====================================
 * MOSTRAR EPISÓDIOS
 * =====================================
 */

function montarEpisodios(
    lista
){

    var box =
        document.getElementById(
            "listaEpisodios"
        );


    box.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var ep =
            lista[i];


        var botao =
            document.createElement(
                "button"
            );


        botao.className=
            "ep";


        botao.innerHTML=
            esc(
                ep.titulo
            );


        botao.setAttribute(
            "data-url",
            ep.url
        );


        /*
         * Nesta etapa não abrimos
         * vídeo escondido/protegido.
         *
         * Só identificamos episódios
         * realmente públicos.
         */
        botao.onclick =
            function(){

                alert(
                    "Episódio público encontrado:\n"+
                    this.getAttribute(
                        "data-url"
                    )
                );
            };


        box.appendChild(
            botao
        );
    }
}



/*
 * =====================================
 * PESQUISA
 * =====================================
 */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    exibindo=[];


    for(
        var i=0;
        i<catalogo.length;
        i++
    ){

        if(
            catalogo[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            exibindo.push(
                catalogo[i]
            );
        }
    }


    montarGrade(
        exibindo
    );
}



/*
 * =====================================
 * URL
 * =====================================
 */

function normalizarUrl(
    url
){

    if(!url){
        return "";
    }


    url =
        String(url);


    if(
        url.indexOf(
            "javascript:"
        ) === 0
    ){

        return "";
    }


    if(
        url.indexOf(
            "#"
        ) === 0
    ){

        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
    ){

        /*
         * Só aceita nosso domínio
         * nesta etapa.
         */
        if(
            url.indexOf(
                "https://assistirfarah.com/"
            ) === 0

            ||

            url.indexOf(
                "https://www.assistirfarah.com/"
            ) === 0
        ){

            return url;
        }


        return "";
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return normalizarUrl(
            "https:"+url
        );
    }


    if(
        url.charAt(0) === "/"
    ){

        return

            "https://assistirfarah.com"+
            url;
    }


    try{

        return new URL(
            url,
            URL_BASE
        ).href;

    }catch(e){

        return "";
    }
}



function normalizarImagem(
    url
){

    if(!url){
        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
        ||
        url.indexOf(
            "http://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    if(
        url.charAt(0) === "/"
    ){

        return

            "https://assistirfarah.com"+
            url;
    }


    return "";
}



/*
 * =====================================
 * UTIL
 * =====================================
 */

function limpar(
    texto
){

    if(!texto){
        return "";
    }


    return String(texto)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^\s+|\s+$/g,
            ""
        );
}



function esc(
    texto
){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";
    }


    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}



function definirStatus(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );


    box.className =
        "status";


    if(tipo){

        box.className +=
            " "+tipo;
    }


    box.innerHTML=
        esc(
            texto
        );
}
