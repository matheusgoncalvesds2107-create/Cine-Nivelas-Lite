<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinenovelas Lite</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0d0d0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #17171b;
      padding: 18px 16px;
      font-size: 20px;
      font-weight: bold;
    }

    .subtitulo {
      color: #999;
      font-size: 12px;
      padding: 12px 16px 0;
    }

    .busca {
      margin: 14px 16px;
    }

    .busca input {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #24242b;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .status {
      margin: 10px 16px;
      padding: 12px;
      background: #18181d;
      border-radius: 10px;
      font-size: 13px;
      color: #bbb;
      word-break: break-word;
    }

    .titulo {
      padding: 5px 16px 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 80px;
    }

    .card {
      background: #1a1a20;
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #292930;
    }

    .card .nome {
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .erro {
      color: #ff8a8a;
    }

    .sucesso {
      color: #8cff9a;
    }

    .episodios {
      padding: 16px;
    }

    .episodio {
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #202027;
    }

    button {
      background: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 8px 0;
      font-weight: bold;
    }

    .voltar {
      margin: 10px 16px;
    }
  </style>
</head>

<body>

<header>CINENOVELAS LITE</header>

<div id="telaCatalogo">

  <div class="subtitulo">
    Versão leve para Android 6
  </div>

  <div class="busca">
    <input
      id="pesquisa"
      type="text"
      placeholder="Pesquisar novelas..."
      onkeyup="filtrar()"
    >
  </div>

  <div id="status" class="status">
    Testando conexão...
  </div>

  <div class="titulo">Novelas</div>

  <div id="catalogo" class="grid"></div>

</div>

<div id="telaEpisodios" style="display:none">

  <div class="voltar">
    <button onclick="voltarCatalogo()">← Voltar</button>
  </div>

  <div id="tituloNovela" class="titulo"></div>

  <div id="episodios" class="episodios"></div>

</div>

  var el = document.getElementById("status");

  if (tipo === "erro") {
    el.innerHTML = '<span class="erro">' + msg + '</span>';
  } else if (tipo === "ok") {
    el.innerHTML = '<span class="sucesso">' + msg + '</span>';
  } else {
    el.innerHTML = msg;
  }
}

  for (var i = 0; i < campos.length; i++) {
    var valor = obj[campos[i]];

    if (valor !== undefined && valor !== null && valor !== "") {
      return valor;
    }
  }

  return "";
}
