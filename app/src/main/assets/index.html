<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0">

<title>NovelasPlay</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0d0d0e;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,
input{
    font-family:Arial,sans-serif;
}

.topo{
    height:82px;
    background:#101011;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid #292929;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo1{
    color:#ef1741;
}

.logo2{
    color:#fff;
}

.barraBusca{
    padding:17px;
    background:#101011;
    border-bottom:7px solid #222;
}

.buscaBox{
    display:flex;
    background:#050505;
    border-radius:28px;
    overflow:hidden;
}

.buscaBox input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#050505;
    color:#fff;
    padding:15px 18px;
    font-size:17px;
}

.btnBusca{
    width:62px;
    border:0;
    background:#e31326;
    color:#fff;
    font-size:24px;
}

main{
    padding:17px;
}

.status{
    background:#1d1d20;
    border-radius:9px;
    padding:13px;
    margin-bottom:18px;
    color:#bbb;
    line-height:1.5;
}

.ok{
    color:#8cff9b;
}

.erro{
    color:#ff8585;
}

.categorias{
    display:flex;
    gap:9px;
    overflow-x:auto;
    margin-bottom:22px;
}

.categorias button{
    flex:none;
    min-height:45px;
    padding:0 16px;
    border:0;
    border-radius:22px;
    background:#222;
    color:#fff;
    font-weight:bold;
}

.categorias button.ativo{
    background:#e31326;
}

.tituloSecao{
    display:flex;
    align-items:center;
    margin:22px 0 15px;
    font-size:22px;
    font-weight:bold;
}

.linha{
    width:5px;
    height:32px;
    background:#ef1837;
    margin-right:11px;
}

.grade{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.card{
    min-width:0;
}

.capa{
    height:170px;
    border-radius:7px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:9px;

    background:
        linear-gradient(
            145deg,
            #53111a,
            #18181b 55%,
            #a51c2f
        );
}

.capa img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nome{
    margin-top:7px;
    font-size:14px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.meta{
    color:#999;
    font-size:12px;
    margin-top:3px;
}


/* DETALHES */

#detalheTela{
    display:none;
}

.subTopo{
    min-height:70px;
    background:#101011;

    display:flex;
    align-items:center;

    padding:12px 16px;

    border-bottom:2px solid #ef1837;
}

.voltar{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:#252525;
    color:#fff;

    font-size:27px;

    margin-right:13px;
}

.subTitulo strong{
    display:block;
    font-size:19px;
}

.subTitulo span{
    color:#aaa;
    font-size:13px;
}

.detalhes{
    padding:17px;
}

.painel{
    padding:16px;

    background:#1d1d20;

    border-radius:10px;
}

.painel h2{
    margin:0 0 8px;
}

.info{
    color:#bbb;
    line-height:1.5;
}

</style>
</head>

<body>


<!-- INÍCIO -->

<div id="catalogoTela">

<div class="topo">

    <div class="logo">

        <span class="logo1">
            NOVELAS
        </span>

        <span class="logo2">
            PLAY
        </span>

    </div>

</div>


<div class="barraBusca">

    <div class="buscaBox">

        <input
            id="busca"
            placeholder="Pesquisar...">

        <button
            id="btnBusca"
            class="btnBusca">

            🔍

        </button>

    </div>

</div>


<main>

<div
    id="status"
    class="status">

    Iniciando motor...

</div>


<div class="categorias">

    <button
        id="catTurcas"
        class="ativo">

        Novelas Turcas

    </button>

    <button
        id="catOutros">

        Outros Dramas

    </button>

    <button
        id="catTudo">

        Tudo

    </button>

</div>


<div class="tituloSecao">

    <div class="linha"></div>

    <span id="tituloCategoria">
        Novelas Turcas
    </span>

</div>


<div
    id="grade"
    class="grade">
</div>

</main>

</div>



<!-- DETALHE -->

<div id="detalheTela">

<div class="subTopo">

    <button
        id="btnVoltar"
        class="voltar">

        ‹

    </button>

    <div class="subTitulo">

        <strong id="tituloTopo">
            Novela
        </strong>

        <span>
            NovelasPlay
        </span>

    </div>

</div>


<div class="detalhes">

    <div class="painel">

        <h2 id="tituloDetalhe">
            Novela
        </h2>

        <div
            id="metaDetalhe"
            class="meta">
        </div>

        <div
            id="infoDetalhe"
            class="info">

            Carregando informações...

        </div>

    </div>

</div>

</div>



<script>

var FONTES = [

    {
        nome:"AssistirFarah",
        url:"https://assistirfarah.com/",
        tipo:"turca"
    },

    {
        nome:"NetiDizis",
        url:"https://netidizis.club/",
        tipo:"turca"
    },

    {
        nome:"Dramas",
        url:"https://dramas.com.br/",
        tipo:"outros"
    }

];


var catalogo = [];

var exibindo = [];

var categoriaAtual =
    "turca";

var fontesConcluidas = 0;



/*
 * ===================================
 * INÍCIO
 * ===================================
 */

function iniciar(){

    if(
        typeof AndroidSite ===
        "undefined"
    ){

        mostrarStatus(
            "Motor AndroidSite não encontrado.",
            "erro"
        );

        return;
    }

    mostrarStatus(
        "Carregando as 3 fontes..."
    );

    catalogo = [];

    fontesConcluidas = 0;


    for(
        var i=0;
        i<FONTES.length;
        i++
    ){

        baixarFonte(
            i
        );
    }
}



function baixarFonte(indice){

    var fonte =
        FONTES[indice];

    /*
     * callback separado
     * para cada fonte.
     */

    var callback =
        "receberFonte" +
        indice;


    AndroidSite.get(
        fonte.url,
        callback
    );
}



/*
 * ===================================
 * CALLBACKS
 * ===================================
 */

function receberFonte0(
    codigo,
    html,
    erro
){

    processarFonte(
        0,
        codigo,
        html,
        erro
    );
}


function receberFonte1(
    codigo,
    html,
    erro
){

    processarFonte(
        1,
        codigo,
        html,
        erro
    );
}


function receberFonte2(
    codigo,
    html,
    erro
){

    processarFonte(
        2,
        codigo,
        html,
        erro
    );
}



function processarFonte(
    indice,
    codigo,
    html,
    erro
){

    fontesConcluidas++;


    if(
        !erro &&
        codigo >= 200 &&
        codigo < 400
    ){

        var fonte =
            FONTES[indice];


        var encontrados =
            extrairCatalogoGenerico(
                html,
                fonte
            );


        adicionarSemDuplicar(
            encontrados
        );
    }


    atualizarStatusMotor();


    if(
        fontesConcluidas ===
        FONTES.length
    ){

        aplicarCategoria(
            categoriaAtual
        );
    }
}



/*
 * ===================================
 * EXTRATOR GENÉRICO
 * ===================================
 */

function extrairCatalogoGenerico(
    html,
    fonte
){

    var parser =
        new DOMParser();


    var doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    var links =
        doc.querySelectorAll(
            "a[href]"
        );


    var resultado = [];

    var usados = {};


    for(
        var i=0;
        i<links.length;
        i++
    ){

        var a =
            links[i];


        var href =
            normalizarUrl(
                a.getAttribute(
                    "href"
                ),
                fonte.url
            );


        if(!href){
            continue;
        }


        /*
         * Não adiciona navegação geral,
         * login, categorias etc.
         */

        var texto =
            limpar(
                a.textContent
            );


        var img =
            a.querySelector(
                "img"
            );


        var alt = "";

        if(img){

            alt =
                limpar(
                    img.getAttribute(
                        "alt"
                    )
                );
        }


        var nome =
            texto || alt;


        if(
            !nome ||
            nome.length < 3 ||
            nome.length > 120
        ){

            continue;
        }


        var chave =
            normalizarNome(
                nome
            );


        if(
            usados[chave]
        ){

            continue;
        }


        /*
         * tenta identificar
         * títulos de conteúdo
         */

        var bloco =
            a.parentNode;


        var textoBloco =
            bloco
            ?
            limpar(
                bloco.textContent
            )
            :
            nome;


        var pareceConteudo =
            false;


        if(img){
            pareceConteudo=true;
        }


        if(
            /epis[oó]dios?/i.test(
                textoBloco
            )
        ){
            pareceConteudo=true;
        }


        if(
            /completa/i.test(
                textoBloco
            )
        ){
            pareceConteudo=true;
        }


        if(
            /\b\d+\s*eps?\b/i.test(
                textoBloco
            )
        ){
            pareceConteudo=true;
        }


        if(
            !pareceConteudo
        ){
            continue;
        }


        var capa="";


        if(img){

            capa =
                img.getAttribute(
                    "data-src"
                )
                ||
                img.getAttribute(
                    "data-lazy-src"
                )
                ||
                img.getAttribute(
                    "src"
                )
                ||
                "";
        }


        var episodios="";


        var m =
            textoBloco.match(
                /(\d+)\s*(epis[oó]dios?|eps?)/i
            );


        if(m){

            episodios =
                m[1]+
                " episódios";
        }


        usados[chave]=true;


        resultado.push({

            nome:nome,

            url:href,

            capa:capa,

            episodios:episodios,

            fonte:fonte.nome,

            tipo:fonte.tipo

        });
    }


    return resultado;
}



/*
 * ===================================
 * REMOVE REPETIDOS
 * ===================================
 */

function adicionarSemDuplicar(
    lista
){

    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var novo =
            lista[i];


        var chaveNova =
            normalizarNome(
                novo.nome
            );


        var existe =
            false;


        for(
            var j=0;
            j<catalogo.length;
            j++
        ){

            if(
                normalizarNome(
                    catalogo[j].nome
                ) ===
                chaveNova
            ){

                existe=true;


                /*
                 * Se a nova entrada tem capa
                 * e a antiga não, melhora
                 * a entrada existente.
                 */

                if(
                    !catalogo[j].capa &&
                    novo.capa
                ){

                    catalogo[j].capa =
                        novo.capa;
                }


                if(
                    !catalogo[j].episodios &&
                    novo.episodios
                ){

                    catalogo[j].episodios =
                        novo.episodios;
                }


                break;
            }
        }


        if(!existe){

            catalogo.push(
                novo
            );
        }
    }
}



/*
 * ===================================
 * CATEGORIAS
 * ===================================
 */

function aplicarCategoria(
    categoria
){

    categoriaAtual =
        categoria;


    exibindo=[];


    for(
        var i=0;
        i<catalogo.length;
        i++
    ){

        if(
            categoria === "tudo"
            ||
            catalogo[i].tipo === categoria
        ){

            exibindo.push(
                catalogo[i]
            );
        }
    }


    if(
        categoria === "turca"
    ){

        document
        .getElementById(
            "tituloCategoria"
        )
        .innerHTML =
            "Novelas Turcas";
    }


    if(
        categoria === "outros"
    ){

        document
        .getElementById(
            "tituloCategoria"
        )
        .innerHTML =
            "Outros Dramas";
    }


    if(
        categoria === "tudo"
    ){

        document
        .getElementById(
            "tituloCategoria"
        )
        .innerHTML =
            "Todo o catálogo";
    }


    atualizarBotoesCategoria();


    montarGrade(
        exibindo
    );
}



function atualizarBotoesCategoria(){

    document
    .getElementById(
        "catTurcas"
    )
    .className =
        categoriaAtual === "turca"
        ?
        "ativo"
        :
        "";


    document
    .getElementById(
        "catOutros"
    )
    .className =
        categoriaAtual === "outros"
        ?
        "ativo"
        :
        "";


    document
    .getElementById(
        "catTudo"
    )
    .className =
        categoriaAtual === "tudo"
        ?
        "ativo"
        :
        "";
}



/*
 * ===================================
 * GRADE
 * ===================================
 */

function montarGrade(
    lista
){

    var grade =
        document.getElementById(
            "grade"
        );


    grade.innerHTML="";


    for(
        var i=0;
        i<lista.length;
        i++
    ){

        var item =
            lista[i];


        var card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        var imagem="";


        if(
            item.capa &&
            item.capa.indexOf(
                "http"
            ) === 0
        ){

            imagem =
                '<img src="' +
                esc(
                    item.capa
                ) +
                '" alt="">';

        }else{

            imagem =
                esc(
                    item.nome
                );
        }


        var meta =
            item.episodios
            ?
            item.episodios
            :
            "";


        card.innerHTML =

            '<div class="capa">'+
            imagem+
            '</div>'+

            '<div class="nome">'+
            esc(
                item.nome
            )+
            '</div>'+

            '<div class="meta">'+
            esc(
                meta
            )+
            '</div>';


        card.setAttribute(
            "data-index",
            i
        );


        card.onclick =
            function(){

                var indice =
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        )
                    );


                abrirDetalhe(
                    exibindo[
                        indice
                    ]
                );
            };


        grade.appendChild(
            card
        );
    }
}



/*
 * ===================================
 * DETALHE
 * ===================================
 */

function abrirDetalhe(
    item
){

    document
    .getElementById(
        "catalogoTela"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "detalheTela"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "tituloTopo"
    )
    .innerHTML =
        esc(
            item.nome
        );


    document
    .getElementById(
        "tituloDetalhe"
    )
    .innerHTML =
        esc(
            item.nome
        );


    document
    .getElementById(
        "metaDetalhe"
    )
    .innerHTML =
        esc(
            item.episodios
        );


    document
    .getElementById(
        "infoDetalhe"
    )
    .innerHTML =
        "Conteúdo localizado pelo Motor NovelasPlay.<br><br>"+
        "No próximo passo vamos identificar temporadas e episódios públicos desta página.";
}



/*
 * ===================================
 * BUSCA
 * ===================================
 */

function pesquisar(){

    var termo =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase();


    var resultado=[];


    for(
        var i=0;
        i<catalogo.length;
        i++
    ){

        if(
            catalogo[i]
            .nome
            .toLowerCase()
            .indexOf(
                termo
            ) >= 0
        ){

            resultado.push(
                catalogo[i]
            );
        }
    }


    exibindo =
        resultado;


    document
    .getElementById(
        "tituloCategoria"
    )
    .innerHTML =
        termo
        ?
        "Resultados"
        :
        "Todo o catálogo";


    montarGrade(
        resultado
    );
}



/*
 * ===================================
 * STATUS
 * ===================================
 */

function atualizarStatusMotor(){

    mostrarStatus(
        "Motor: "+
        fontesConcluidas+
        "/"+
        FONTES.length+
        " fontes carregadas · "+
        catalogo.length+
        " títulos encontrados.",
        fontesConcluidas ===
        FONTES.length
        ?
        "ok"
        :
        ""
    );
}



function mostrarStatus(
    texto,
    tipo
){

    var box =
        document.getElementById(
            "status"
        );


    box.className =
        "status";


    if(tipo){

        box.className +=
            " "+tipo;
    }


    box.innerHTML =
        esc(
            texto
        );
}



/*
 * ===================================
 * UTIL
 * ===================================
 */

function normalizarUrl(
    url,
    base
){

    if(!url){
        return "";
    }


    url =
        String(url);


    if(
        url.indexOf(
            "javascript:"
        ) === 0
        ||
        url.indexOf(
            "mailto:"
        ) === 0
        ||
        url.charAt(0) === "#"
    ){

        return "";
    }


    if(
        url.indexOf(
            "https://"
        ) === 0
        ||
        url.indexOf(
            "http://"
        ) === 0
    ){

        return url;
    }


    if(
        url.indexOf(
            "//"
        ) === 0
    ){

        return "https:"+url;
    }


    try{

        return new URL(
            url,
            base
        ).href;

    }catch(e){

        return "";
    }
}



function normalizarNome(
    nome
){

    if(!nome){
        return "";
    }


    return String(nome)

        .toLowerCase()

        .normalize
        ?
        String(nome)
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        :
        String(nome)
        .toLowerCase();
}



function limpar(
    texto
){

    if(!texto){
        return "";
    }


    return String(texto)

        .replace(
            /\s+/g,
            " "
        )

        .replace(
            /^\s+|\s+$/g,
            ""
        );
}



function esc(
    texto
){

    if(!texto){
        return "";
    }


    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}



/*
 * ===================================
 * EVENTOS
 * ===================================
 */

document
.getElementById(
    "btnBusca"
)
.addEventListener(
    "click",
    pesquisar
);


document
.getElementById(
    "busca"
)
.addEventListener(
    "keyup",
    pesquisar
);


document
.getElementById(
    "catTurcas"
)
.addEventListener(
    "click",
    function(){

        aplicarCategoria(
            "turca"
        );
    }
);


document
.getElementById(
    "catOutros"
)
.addEventListener(
    "click",
    function(){

        aplicarCategoria(
            "outros"
        );
    }
);


document
.getElementById(
    "catTudo"
)
.addEventListener(
    "click",
    function(){

        aplicarCategoria(
            "tudo"
        );
    }
);


document
.getElementById(
    "btnVoltar"
)
.addEventListener(
    "click",
    function(){

        document
        .getElementById(
            "detalheTela"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "catalogoTela"
        )
        .style.display =
            "block";
    }
);


setTimeout(
    iniciar,
    500
);

</script>

</body>
</html>
